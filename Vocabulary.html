            color: var(--text-dark);
        }

        .app-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 28px;

            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: appAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes appAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 3D Title Header */
        .header-3d {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);

            text-align: center;
            position: relative;
            border-bottom: 5px solid var(--primary);
        }

        .main-3d-title {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: var(--3d-shadow);
            position: relative;
            z-index: 2;
            animation: floatText 4s ease-in-out infinite alternate;
        }

        @keyframes floatText {
            0% { transform: translateY(0); filter: drop-shadow(0 0 10px rgba(99,102,241,0.6)); }
            100% { transform: translateY(-5px); filter: drop-shadow(0 0 25px rgba(236,72,153,0.8)); }
        }

        .sub-3d-title {
            color: #cbd5e1;
            font-size: 19px;
            margin-top: 15px;
            font-weight: 600;
            position: relative;
            z-index: 2;
        }

            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            color: #34d399;
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.25);
        }

        /* Top Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        /* Chapter Tabs Navigation */
        .chapter-nav-bar {
            display: flex;
            background: #1e293b;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) #1e293b;
        }

        .nav-tab-btn {
            flex: 0 0 auto;
            padding: 18px 22px;
            color: #94a3b8;
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            position: relative;
            outline: none;
        }

        .nav-tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-tab-btn.active {
            color: #ffffff;
            background: var(--primary);
        }

        .nav-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #ec4899;
        }

        /* Chapter Views */
        .chapter-view {
            display: none;
            padding: 35px;
            animation: viewSlide 0.4s ease-out;
        }

        .chapter-view.active {
            display: block;
        }

        @keyframes viewSlide {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .ch-title-header {
            font-size: 26px;
            font-weight: 800;
            color: #1e1b4b;
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 3px solid #e0e7ff;
        }

        .topic-group {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);

        }

            font-size: 20px;
            font-weight: 700;
            color: #4338ca;
            margin-top: 0;
            margin-bottom: 18px;
            display: flex;
            align-items: center;

            content: '';
            display: inline-block;
            width: 8px;
            height: 22px;
            background: var(--primary-gradient);
            border-radius: 4px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

            background: #f8fafc;

            border-radius: 14px;
            padding: 15px;
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

            justify-content: space-between;
            align-items: baseline;

            font-weight: 800;
            color: #1e1b4b;

        }

            font-weight: 700;
            padding: 2px 8px;

            background: #e0e7ff;
            color: #3730a3;

            margin-bottom: 6px;

            .main-3d-title { font-size: 26px; }

        let activeChapterIndex = 1;

        // Render Nav Tabs
        function buildNavTabs() {
            const tabsWrapper = document.getElementById("tabs-wrapper");
            tabsWrapper.innerHTML = "";
            fullVocabDatabase.forEach(ch => {
                const btn = document.createElement("button");
                btn.className = `nav-tab-btn ${ch.chapter === activeChapterIndex ? 'active' : ''}`;
                btn.innerText = `অধ্যায় ${ch.chapter}`;
                btn.onclick = () => selectChapter(ch.chapter);
                tabsWrapper.appendChild(btn);
            });
        }

        // Render Active Chapter View
        function buildChapterContent() {
            const contentWrapper = document.getElementById("main-content-wrapper");
            contentWrapper.innerHTML = "";

            const activeChData = fullVocabDatabase.find(c => c.chapter === activeChapterIndex);
            if (!activeChData) return;

            const chDiv = document.createElement("div");
            chDiv.className = "chapter-view active";
            
            let html = `<h2 class="ch-title-header">${activeChData.title}</h2>`;

            activeChData.topics.forEach(tp => {
                html += `
                    <div class="topic-group">
                        <h3 class="topic-header">${tp.name}</h3>
                        <div class="vocab-grid">
                `;

                tp.words.forEach(w => {
                    html += `
                        <div class="vocab-card" onclick="speakText('${w.eng}')" title="ক্লিক করে উচ্চারণ শুনুন">
                            <div class="card-header-row">
                                <span class="english-word">${w.eng}</span>
                                <span class="pos-tag">${w.pos}</span>
                            </div>
                            <div class="pronun-text">🔊 [${w.pron}]</div>
                            <div class="bengali-meaning">${w.bng}</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            chDiv.innerHTML = html;
            contentWrapper.appendChild(chDiv);

            // Update Control Elements State
            document.getElementById("chapter-indicator-top").innerText = `অধ্যায় ${activeChapterIndex} / ${fullVocabDatabase.length}`;
            document.getElementById("footer-page-text").innerText = `অধ্যায় ${activeChapterIndex}`;
            document.getElementById("btn-prev-chapter").disabled = (activeChapterIndex === 1);
            document.getElementById("btn-next-chapter").disabled = (activeChapterIndex === fullVocabDatabase.length);

            buildNavTabs();
        }

        function selectChapter(chNum) {
            activeChapterIndex = chNum;
            buildChapterContent();
            document.querySelector('.app-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function stepChapter(dir) {
            const target = activeChapterIndex + dir;
            if (target >= 1 && target <= fullVocabDatabase.length) {
                selectChapter(target);
            }
        }

        // Audio Voice Engine (Text to Speech)
        function speakText(phrase) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(phrase);
                speech.lang = 'en-US';
                speech.rate = 0.85;
                window.speechSynthesis.speak(speech);
            }
        }

        // Search Filter Engine
        function filterWords() {
            const query = document.getElementById("app-search-input").value.toLowerCase().trim();
            const cards = document.querySelectorAll(".vocab-card");

            cards.forEach(card => {
                const eng = card.querySelector(".english-word").innerText.toLowerCase();
                const pron = card.querySelector(".pronun-text").innerText.toLowerCase();
                const bng = card.querySelector(".bengali-meaning").innerText.toLowerCase();

                if (eng.includes(query) || pron.includes(query) || bng.includes(query)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Initialize Application
        buildChapterContent();
    </script>
</div>
