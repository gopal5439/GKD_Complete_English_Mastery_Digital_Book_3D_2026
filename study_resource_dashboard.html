<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডিজিটাল প্রশ্ন ব্যাংক - English & Admission Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Hind Siliguri -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- Header / Navigation -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            <!-- Left Side Logo & Back Button -->
            <div class="flex items-center space-x-3 gap-3">
                <button onclick="window.location.href='exam_&_others.html.html'"
                    class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-medium text-xs sm:text-sm transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i> 
                    <span>Back</span>
                </button>

                <div class="h-6 w-px bg-slate-200 dark:bg-slate-700"></div>

                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-graduation-cap text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-base sm:text-lg font-bold leading-tight">ডিজিটাল প্রশ্ন ব্যাংক</h1>
                        <p class="text-[10px] sm:text-xs text-slate-500 dark:text-slate-400">SSC, HSC ও এডমিশন রিসোর্স</p>
                    </div>
                </div>
            </div>

            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition text-slate-600 dark:text-slate-300">
                <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-lg hidden"></i>
                <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search & Filter Bar -->
        <div class="mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <input type="text" id="search-input" placeholder="বিষয় বা ক্যাটাগরি দিয়ে খুঁজুন..." 
                    class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm text-sm transition">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-base"></i>
            </div>

            <!-- Stats/Info Badge -->
            <div class="text-sm font-medium text-slate-500 dark:text-slate-400">
                মোট মডিউল পাওয়া গেছে: <span id="total-count" class="font-bold text-brand-600 dark:text-brand-500">0</span> টি
            </div>
        </div>

        <!-- Category Navigation Tabs -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 border-b border-slate-200 dark:border-slate-700 scrollbar-none" id="category-tabs">
            <!-- Dynamic Category Buttons Will Render Here -->
        </div>

        <!-- Question Cards Grid -->
        <div id="questions-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Question Items Will Render Here -->
        </div>

        <!-- Empty State Message -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
            <i class="fa-solid fa-folder-open text-5xl text-slate-300 dark:text-slate-600 mb-4"></i>
            <h3 class="text-lg font-bold text-slate-600 dark:text-slate-400">কোনো ফাইল পাওয়া যায়নি!</h3>
            <p class="text-sm text-slate-400 dark:text-slate-500">অন্য কোনো কি-ওয়ার্ড দিয়ে খুঁজে দেখুন</p>
        </div>
    </main>

    <!-- JavaScript Data Logic & UI Handling -->
    <script>
        /**
         * ========================================================
         * 1. DATA CONFIGURATION (এখানে আপনার পছন্দমতো ফাইল লিংক বসাতে পারবেন)
         * ========================================================
         */
        const questionData = [
            // SSC Items
            {
                id: 1,
                title: "SSC English 1st Paper 2026",
                subtitle: "সকল বোর্ড প্রশ্ন ও উত্তরপত্র",
                category: "ssc",
                subject: "English 1st Paper",
                year: "2026",
                fileUrl: "SSC_English_1st_Paper_2026.html",
                icon: "fa-book-open"
            },
            {
                id: 2,
                title: "SSC English 2nd Paper 2026",
                subtitle: "গ্রামার ও রাইটিং পার্ট ফাইল",
                category: "ssc",
                subject: "English 2nd Paper",
                year: "2026",
                fileUrl: "SSC_English_2nd_Paper_2026.html",
                icon: "fa-pen-nib"
            },
            
            // HSC Items
            {
                id: 3,
                title: "HSC English 1st Paper 2026",
                subtitle: "প্যাসেজ ও মডেল টেস্ট ফাইল",
                category: "hsc",
                subject: "English 1st Paper",
                year: "2026",
                fileUrl: "HSC_English_1st_Paper_2026.html",
                icon: "fa-language"
            },
            {
                id: 4,
                title: "HSC English 2nd Paper 2026",
                subtitle: "এডভান্সড গ্রামার ও বোর্ড সলিউশন",
                category: "hsc",
                subject: "English 2nd Paper",
                year: "2026",
                fileUrl: "HSC_English_2nd_Paper_2026.html",
                icon: "fa-file-signature"
            },

            // Admission Items
            {
                id: 5,
                title: "University Admission",
                subtitle: "বিশ্ববিদ্যালয় ভর্তি পরীক্ষার প্রশ্ন ব্যাংক",
                category: "admission",
                subject: "University",
                year: "2026",
                fileUrl: "University_Admission_2026.html", // ইউনিভার্সিটি লিংক
                icon: "fa-building-columns"
            },
            {
                id: 6,
                title: "Medical Admission",
                subtitle: "মেডিকেল ভর্তি পরীক্ষার প্রশ্ন ও সমাধান",
                category: "admission",
                subject: "Medical",
                year: "2026",
                fileUrl: "Medical_Admission_2026.html", // মেডিকেল লিংক
                icon: "fa-user-doctor"
            },
            {
                id: 7,
                title: "National University Admission",
                subtitle: "জাতীয় বিশ্ববিদ্যালয় ভর্তি নির্দেশিকা ও প্রশ্ন",
                category: "admission",
                subject: "NU Admission",
                year: "2026",
                fileUrl: "NU_Admission_2026.html", // জাতীয় বিশ্ববিদ্যালয় লিংক
                icon: "fa-university"
            }
        ];

        // Categories Configuration
        const categories = [
            { id: "all", label: "সব ফাইল", icon: "fa-layer-group" },
            { id: "ssc", label: "SSC ইংরেজি", icon: "fa-school" },
            { id: "hsc", label: "HSC ইংরেজি", icon: "fa-graduation-cap" },
            { id: "admission", label: "এডমিশন টেস্ট", icon: "fa-university" }
        ];

        // State Variables
        let currentCategory = "all";
        let searchQuery = "";

        /**
         * ========================================================
         * 2. CORE NAVIGATION FUNCTION (ফাইলে নেভিগেট করার ফাংশন)
         * ========================================================
         */
        function navigateToPage(fileUrl) {
            if (fileUrl) {
                window.location.href = fileUrl;
            } else {
                alert("দুঃখিত! এই ফাইলের লিংকটি এখনো যুক্ত করা হয়নি।");
            }
        }

        /**
         * ========================================================
         * 3. RENDER UI COMPONENTS
         * ========================================================
         */

        // Category Tabs Render
        function renderCategories() {
            const tabsContainer = document.getElementById("category-tabs");
            tabsContainer.innerHTML = categories.map(cat => {
                const isActive = cat.id === currentCategory;
                return `
                    <button onclick="setCategory('${cat.id}')" 
                        class="px-5 py-2.5 rounded-xl font-semibold text-sm whitespace-nowrap transition flex items-center gap-2 ${
                            isActive 
                            ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' 
                            : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-brand-500'
                        }">
                        <i class="fa-solid ${cat.icon}"></i> ${cat.label}
                    </button>
                `;
            }).join('');
        }

        // Questions Grid Render
        function renderQuestions() {
            const gridContainer = document.getElementById("questions-grid");
            const emptyState = document.getElementById("empty-state");
            const totalCountEl = document.getElementById("total-count");

            // Filter logic
            const filtered = questionData.filter(item => {
                const matchesCategory = currentCategory === "all" || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.subject.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      item.year.includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            totalCountEl.textContent = filtered.length;

            if (filtered.length === 0) {
                gridContainer.innerHTML = "";
                emptyState.classList.remove("hidden");
                emptyState.classList.add("flex");
                return;
            }

            emptyState.classList.add("hidden");
            emptyState.classList.remove("flex");

            gridContainer.innerHTML = filtered.map(item => `
                <div onclick="navigateToPage('${item.fileUrl}')" 
                    class="group p-5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand-500 dark:hover:border-brand-500 transition-all duration-300 shadow-sm hover:shadow-lg cursor-pointer flex flex-col justify-between relative overflow-hidden">
                    
                    <div class="absolute -right-4 -top-4 w-16 h-16 bg-brand-500/10 rounded-full group-hover:scale-150 transition-transform duration-500"></div>

                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-700 text-brand-500 flex items-center justify-center text-xl group-hover:bg-brand-500 group-hover:text-white transition duration-300 shadow-sm">
                                <i class="fa-solid ${item.icon}"></i>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 uppercase tracking-wider">
                                ${item.category}
                            </span>
                        </div>

                        <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 mb-1 group-hover:text-brand-600 dark:group-hover:text-brand-500 transition">
                            ${item.title}
                        </h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">
                            ${item.subtitle}
                        </p>
                    </div>

                    <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between text-xs font-semibold text-brand-600 dark:text-brand-500">
                        <span>ফাইল খুলুন</span>
                        <div class="w-7 h-7 rounded-full bg-brand-50 dark:bg-brand-500/10 flex items-center justify-center group-hover:translate-x-1 transition-transform">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        /**
         * ========================================================
         * 4. EVENT LISTENERS & FILTER LOGIC
         * ========================================================
         */
        function setCategory(catId) {
            currentCategory = catId;
            renderCategories();
            renderQuestions();
        }

        document.getElementById("search-input").addEventListener("input", (e) => {
            searchQuery = e.target.value.trim();
            renderQuestions();
        });

        // Dark/Light Theme Switching
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        themeToggleBtn.addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
        });

        // Initialize Page
        window.onload = function() {
            renderCategories();
            renderQuestions();
        };
    </script>
</body>
</html>
