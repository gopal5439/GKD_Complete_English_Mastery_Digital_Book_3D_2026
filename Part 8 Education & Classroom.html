                exp: "শিক্ষক নতুন অধ্যায় পড়ানোর কাজ সম্পন্ন করেছেন বোঝাতে Present Perfect Tense ব্যবহার করা হয়েছে। Taught হলো teach-এর past এবং past participle form।"
            },
            {
                num: "১৯৭",
                bn: "তুমি কোন বিষয়ে সবচেয়ে ভালো?",
                en: "Which subject are you best at?",
                uccharon: "হুইচ সাবজেক্ট আর ইউ বেস্ট অ্যাট?",
                exp: "কোনো শিক্ষার্থী কোন বিষয়ে সবচেয়ে দক্ষ তা জানতে প্রশ্নটি ব্যবহার করা হয়। Best at অর্থ কোনো বিষয়ে সবচেয়ে ভালো বা দক্ষ।"
            },
            {
                num: "১৯৮",
                bn: "আমার গণিত খুব ভালো লাগে।",
                en: "I am very fond of mathematics.",
                uccharon: "আই অ্যাম ভেরি ফন্ড অভ ম্যাথমেটিক্স।",
                exp: "কোনো বিষয় খুব পছন্দ বোঝাতে be fond of ব্যবহার করা হয়। Mathematics অর্থ গণিত।"
            },
            {
                num: "১৯৯",
                bn: "নিয়মিত অনুশীলন করলে তুমি ভালো ফল করবে।",
                en: "If you practise regularly, you will get good results.",
                uccharon: "ইফ ইউ প্র্যাকটিস রেগুলারলি, ইউ উইল গেট গুড রিজাল্টস।",
                exp: "কোনো শর্ত পূরণ হলে ভবিষ্যতে কী ফল হবে তা বোঝাতে First Conditional ব্যবহার করা হয়েছে। If অর্থ যদি এবং regularly অর্থ নিয়মিত। এখানে ব্রিটিশ ইংরেজির বানান practise ব্যবহৃত হয়েছে।"
            },
            {
                num: "২০০",
                bn: "শিক্ষা মানুষের জীবনে গুরুত্বপূর্ণ ভূমিকা পালন করে।",
                en: "Education plays an important role in human life.",
                uccharon: "এডুকেশন প্লেইজ অ্যান ইমপোর্ট্যান্ট রোল ইন হিউম্যান লাইফ।",
                exp: "শিক্ষার সাধারণ গুরুত্ব বোঝাতে Present Simple Tense ব্যবহার করা হয়েছে। Plays an important role অর্থ গুরুত্বপূর্ণ ভূমিকা পালন করে।"
            }
        ];

        const container = document.getElementById('cards-container');

        // Create Card HTML Elements
        sentencesData.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-step', '0');

            card.innerHTML = `
                <div class="card-header">
                    <span class="sentence-num">${data.num}</span>
                    <div class="bn-text">${data.bn}</div>
                    <span class="step-indicator" id="step-ind-${index}">ক্লিক করুন</span>
                </div>
                
                <div class="content-reveal" id="reveal-${index}">
                    <div class="en-box">
                        <div class="en-text">${data.en}</div>
                        <div class="uccharon-text">উচ্চারণ: ${data.uccharon}</div>
                        <div class="voice-btn-group">
                            <button class="voice-btn us" onclick="speakText(event, '${escapeQuotes(data.en)}', 'en-US')">
                                <i class="fa-solid fa-volume-high"></i> US Accent
                            </button>
                            <button class="voice-btn uk" onclick="speakText(event, '${escapeQuotes(data.en)}', 'en-GB')">
                                <i class="fa-solid fa-volume-high"></i> UK Accent
                            </button>
                        </div>
                    </div>
                    <div class="explanation-box" id="exp-${index}">
                        <strong>ব্যাখ্যা:</strong> ${data.exp}
                    </div>
                </div>
            `;

            // Card Toggle Click Logic
            card.addEventListener('click', (e) => {
                // Prevent toggle if clicking audio buttons
                if (e.target.closest('.voice-btn')) return;

                let currentStep = parseInt(card.getAttribute('data-step'));
                const revealBox = document.getElementById(`reveal-${index}`);
                const expBox = document.getElementById(`exp-${index}`);
                const indicator = document.getElementById(`step-ind-${index}`);

                if (currentStep === 0) {
                    // Step 1: Reveal English & Pronunciation
                    revealBox.style.display = 'block';
                    card.setAttribute('data-step', '1');
                    indicator.innerText = '১/২ স্টেপ';
                    indicator.style.color = '#38bdf8';
                } else if (currentStep === 1) {
                    // Step 2: Reveal Explanation
                    expBox.style.display = 'block';
                    card.setAttribute('data-step', '2');
                    indicator.innerText = 'সম্পূর্ণ';
                    indicator.style.color = '#c084fc';
                } else {
                    // Step 3: Reset
                    revealBox.style.display = 'none';
                    expBox.style.display = 'none';
                    card.setAttribute('data-step', '0');
                    indicator.innerText = 'ক্লিক করুন';
                    indicator.style.color = '#94a3b8';
                }
            });

            container.appendChild(card);
        });

        // Helper to avoid quote issues in onclick string
        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        // Text-to-Speech Functionality
        function speakText(event, text, lang) {
            event.stopPropagation(); // Prevents card toggle on button click
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9; // Slightly slower for clear learning
                window.speechSynthesis.speak(utterance);
            } else {
                alert("দুঃখিত, আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই।");
            }
        }
    </script>

</body>
</html>
