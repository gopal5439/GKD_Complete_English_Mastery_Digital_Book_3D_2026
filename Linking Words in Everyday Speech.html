<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOPIC 11: Linking Words & Connected Speech</title>
    <!-- Google Fonts Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-uk: #ec4899;
            --accent-us: #06b6d4;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --text-muted: #94a3b8;
            --font-bn: 'Tiro Bangla', serif;
            --font-en: 'Times New Roman', Times, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-bn);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 850px;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: var(--font-en);
            font-size: 2.2rem;
            color: #818cf8;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        header h2 {
            font-family: var(--font-bn);
            font-size: 1.5rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            width: 100%;
            max-width: 1200px;
            perspective: 1000px;
        }

        /* 3D Glassmorphism Card Style */
        .card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 
                        0 8px 10px -6px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 35px -10px rgba(99, 102, 241, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .card-number {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            font-family: var(--font-en);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* Bengali Sentence Section */
        .sec-bn {
            font-family: var(--font-bn);
            font-size: 1.35rem;
            color: #ffffff;
            line-height: 1.5;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }

        /* English & Pronunciation Section */
        .sec-en {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .en-standard {
            font-family: var(--font-en);
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        .en-natural {
            font-family: var(--font-en);
            font-size: 1.3rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 0.4rem;
        }

        .en-pron {
            font-family: var(--font-bn);
            font-size: 1.05rem;
            color: #f472b6;
        }

        /* Explanation Section */
        .sec-exp {
            display: none;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
            padding: 0.9rem;
            font-family: var(--font-bn);
            font-size: 0.98rem;
            color: var(--text-sub);
            line-height: 1.6;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            animation: fadeIn 0.4s ease-in-out forwards;
            margin-bottom: 1rem;
        }

        /* 3D Audio Control Buttons */
        .audio-controls {
            display: flex;
            gap: 0.8rem;
            margin-top: auto;
            padding-top: 0.5rem;
        }

        .btn-3d {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.6rem 0.8rem;
            border: none;
            border-radius: 10px;
            font-family: var(--font-en);
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .btn-uk {
            background: linear-gradient(to bottom, #f43f5e, #be123c);
            box-shadow: 0 4px 0 #881337, 0 5px 10px rgba(0,0,0,0.4);
        }

        .btn-uk:hover {
            background: linear-gradient(to bottom, #fb7185, #e11d48);
        }

        .btn-uk:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #881337, 0 2px 4px rgba(0,0,0,0.4);
        }

        .btn-us {
            background: linear-gradient(to bottom, #0284c7, #0369a1);
            box-shadow: 0 4px 0 #075985, 0 5px 10px rgba(0,0,0,0.4);
        }

        .btn-us:hover {
            background: linear-gradient(to bottom, #38bdf8, #0284c7);
        }

        .btn-us:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #075985, 0 2px 4px rgba(0,0,0,0.4);
        }

        .click-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 0.3rem;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 1rem 0.5rem; }
            header h1 { font-size: 1.6rem; }
            header h2 { font-size: 1.2rem; }
            .cards-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>TOPIC 11: Linking Words & Connected Speech</h1>
        <h2>শব্দ যুক্ত করে স্বাভাবিক ও সাবলীলভাবে উচ্চারণ করা</h2>
    </header>

    <div class="cards-container" id="cardsContainer"></div>

    <script>
        const data = [
            {
                bn: "১. তুমি কী করছ?",
                standard: "Standard: What are you doing",
                natural: "Whatcha doing?",
                pron: "উচ্চারণ: ওয়াচা ডুইং?",
                exp: "ব্যাখ্যা: দ্রুত কথায় What are you একত্রিত হয়ে Whatcha শোনাতে পারে। এটি অনানুষ্ঠানিক American English-এ প্রচলিত।"
            },
            {
                bn: "২. তুমি কি খেয়েছ?",
                standard: "Standard: Did you eat",
                natural: "Didja eat?",
                pron: "উচ্চারণ: ডিজা ইট?",
                exp: "ব্যাখ্যা: Did you দ্রুত উচ্চারণে /dɪdʒə/ বা কাছাকাছি শোনাতে পারে। এখানে /d/ এবং /j/ মিলে /dʒ/ ধ্বনি তৈরি করে।"
            },
            {
                bn: "৩. আমাকে এটা দাও।",
                standard: "Standard: Give me that.",
                natural: "Gimme that.",
                pron: "উচ্চারণ: গিমি দ্যাট।",
                exp: "ব্যাখ্যা: অনানুষ্ঠানিক কথায় Give me সংক্ষিপ্ত হয়ে Gimme শোনায়।"
            },
            {
                bn: "৪. আমাকে একটু দেখতে দাও।",
                standard: "Standard: Let me see.",
                natural: "Lemme see.",
                pron: "উচ্চারণ: লেমি সি।",
                exp: "ব্যাখ্যা: দ্রুত কথায় Let me প্রায়ই Lemme শোনায়।"
            },
            {
                bn: "৫. তুমি কোথায় যাচ্ছ?",
                standard: "Standard: Where are you going",
                natural: "Where ya going?",
                pron: "উচ্চারণ: হোয়ার ইয়া গোয়িং?",
                exp: "ব্যাখ্যা: Are you দ্রুত কথায় দুর্বল হয়ে ya শোনাতে পারে।"
            },
            {
                bn: "৬. তুমি কি আমাকে শুনতে পাচ্ছ?",
                standard: "Standard: Can you hear me?",
                natural: "Can ya hear me?",
                pron: "উচ্চারণ: ক্যান ইয়া হিয়ার মি?",
                exp: "ব্যাখ্যা: You দুর্বল উচ্চারণে /jə/ বা ya শোনাতে পারে।"
            },
            {
                bn: "৭. তুমি কি আমাকে সাহায্য করতে পারবে?",
                standard: "Standard: Could you help me?",
                natural: "Couldja help me?",
                pron: "উচ্চারণ: কুডজা হেল্প মি?",
                exp: "ব্যাখ্যা: Could you দ্রুত উচ্চারণে /kʊdʒə/ শোনাতে পারে।"
            },
            {
                bn: "৮. তুমি কি এখানে থাকো?",
                standard: "Standard: Do you live here?",
                natural: "D'ya live here?",
                pron: "উচ্চারণ: ডিয়া লিভ হিয়ার?",
                exp: "ব্যাখ্যা: দ্রুত কথায় Do you সংক্ষিপ্ত হয়ে /dəjə/ বা /dʒə/ ধরনের ধ্বনি তৈরি করতে পারে।"
            },
            {
                bn: "৯. তুমি কি এটা জানো?",
                standard: "Standard: Do you know?",
                natural: "D'you know?",
                pron: "উচ্চারণ: ডিউ নো?",
                exp: "ব্যাখ্যা: Do you একসঙ্গে দ্রুত উচ্চারণ করলে মাঝের স্বরধ্বনি দুর্বল হয়ে যায়।"
            },
            {
                bn: "১০. তুমি কি প্রস্তুত?",
                standard: "Standard: Are you ready?",
                natural: "You ready?",
                pron: "উচ্চারণ: ইউ রেডি?",
                exp: "ব্যাখ্যা: অনানুষ্ঠানিক কথোপকথনে প্রশ্নের শুরুতে Are বাদ দেওয়া হতে পারে।"
            },
            {
                bn: "১১. তুমি কি আসছ?",
                standard: "Standard: Are you coming?",
                natural: "You coming?",
                pron: "উচ্চারণ: ইউ কামিং?",
                exp: "ব্যাখ্যা: অনানুষ্ঠানিক কথায় Are বাদ দিয়ে প্রশ্ন করা হয়।"
            },
            {
                bn: "১২. তোমার কী হয়েছে?",
                standard: "Standard: What happened to you",
                natural: "What happened t'ya?",
                pron: "উচ্চারণ: হোয়াট হ্যাপেন্ড টিয়া?",
                exp: "ব্যাখ্যা: To you দ্রুত কথায় /təjə/ শোনাতে পারে।"
            },
            {
                bn: "১৩. তুমি কি আমার সঙ্গে আসবে?",
                standard: "Standard: Are you coming with me?",
                natural: "You coming with me?",
                pron: "উচ্চারণ: ইউ কামিং উইথ মি?",
                exp: "ব্যাখ্যা: কথ্য ইংরেজিতে Are বাদ দেওয়া যায়।"
            },
            {
                bn: "১৪. তুমি কি আমাকে চেনো?",
                standard: "Standard: Do you know me?",
                natural: "D'you know me?",
                pron: "উচ্চারণ: ডিউ নো মি?",
                exp: "ব্যাখ্যা: Do you দ্রুত উচ্চারণে একত্রিত হয়।"
            },
            {
                bn: "১৫. আমি তোমাকে বলছি।",
                standard: "Standard: I'm telling you.",
                natural: "I'm tellin' ya.",
                pron: "উচ্চারণ: আইম টেলিন ইয়া।",
                exp: "ব্যাখ্যা: অনানুষ্ঠানিক উচ্চারণে telling শব্দের শেষের /ŋ/ অনেক সময় /n/ হিসেবে শোনা যায় এবং you দুর্বল হয়ে ya হয়।"
            },
            {
                bn: "১৬. তুমি কী বলতে চাচ্ছ?",
                standard: "Standard: What do you mean?",
                natural: "Whaddaya mean?",
                pron: "উচ্চারণ: ওয়াডাইয়া মিন?",
                exp: "ব্যাখ্যা: What do you দ্রুত উচ্চারণে একাধিক ধ্বনি পরিবর্তনের মধ্য দিয়ে যায়।"
            },
            {
                bn: "১৭. তুমি কি এটা চাও?",
                standard: "Standard: Do you want it?",
                natural: "D'you want it?",
                pron: "উচ্চারণ: ডিউ ওয়ান্ট ইট?",
                exp: "ব্যাখ্যা: Do you সংক্ষিপ্ত করে উচ্চারণ করা হয়।"
            },
            {
                bn: "১৮. তোমাকে দেখতে ভালো লাগছে।",
                standard: "Standard: It's good to see you.",
                natural: "It's good t'see ya.",
                pron: "উচ্চারণ: ইটস গুড টু সি ইয়া।",
                exp: "ব্যাখ্যা: To শব্দটি বাক্যে দুর্বল হয়ে /tə/ শোনায় এবং you দুর্বল উচ্চারণে /jə/ হয়।"
            },
            {
                bn: "১৯. আমি তোমার জন্য অপেক্ষা করছি।",
                standard: "Standard: I'm waiting for you.",
                natural: "I'm waitin' for ya.",
                pron: "উচ্চারণ: আইম ওয়েইটিন ফর ইয়া।",
                exp: "ব্যাখ্যা: কথ্য উচ্চারণে waiting এর /ŋ/ অনেক সময় /n/ হয় এবং you দুর্বল হয়।"
            },
            {
                bn: "২০. তুমি কি আমার কথা বুঝতে পারছ?",
                standard: "Standard: Do you understand me?",
                natural: "D'you understand me?",
                pron: "উচ্চারণ: ডিউ আন্ডারস্ট্যান্ড মি?",
                exp: "ব্যাখ্যা: Do you দ্রুত উচ্চারণে একত্রিত হয়।"
            },
            {
                bn: "২১. তুমি কি আমাকে ফোন করবে?",
                standard: "Standard: Will you call me?",
                natural: "Will ya call me?",
                pron: "উচ্চারণ: উইল ইয়া কল মি?",
                exp: "ব্যাখ্যা: দ্রুত কথায় You দুর্বল হয়ে ya শোনাতে পারে।"
            },
            {
                bn: "২২. তুমি কি আমার সঙ্গে মজা করছ?",
                standard: "Standard: Are you kidding me?",
                natural: "Ya kidding me?",
                pron: "উচ্চারণ: ইয়া কিডিং মি?",
                exp: "ব্যাখ্যা: অনানুষ্ঠানিক কথায় Are বাদ পড়ে এবং You দুর্বলভাবে উচ্চারিত হয়।"
            },
            {
                bn: "২৩. এটা কীভাবে সম্ভব?",
                standard: "Standard: How is that possible?",
                natural: "How's that possible?",
                pron: "উচ্চারণ: হাউজ দ্যাট পসিবল?",
                exp: "ব্যাখ্যা: How is সংক্ষিপ্ত হয়ে How's হয়।"
            },
            {
                bn: "২৪. তুমি কি আমার সঙ্গে একমত?",
                standard: "Standard: Do you agree with me?",
                natural: "D'you agree with me?",
                pron: "উচ্চারণ: ডিউ অ্যাগ্রি উইথ মি?",
                exp: "ব্যাখ্যা: Do you দ্রুত কথায় সংকুচিত হয়।"
            },
            {
                bn: "২৫. আমি তোমাকে পরে দেখা করব।",
                standard: "Standard: I'll see you later.",
                natural: "See ya later.",
                pron: "উচ্চারণ: সি ইয়া লেইটার।",
                exp: "ব্যাখ্যা: বন্ধুত্বপূর্ণ বিদায়ের সময় See ya later খুব প্রচলিত।"
            }
        ];

        const container = document.getElementById('cardsContainer');

        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.step = '0'; // 0: BN only, 1: BN+EN, 2: BN+EN+EXP

            card.innerHTML = `
                <span class="card-number">#${String(index + 1).padStart(2, '0')}</span>
                <div class="sec-bn">${item.bn}</div>
                
                <div class="sec-en">
                    <div class="en-standard">${item.standard}</div>
                    <div class="en-natural">Natural: ${item.natural}</div>
                    <div class="en-pron">${item.pron}</div>
                </div>

                <div class="sec-exp">${item.exp}</div>

                <div class="audio-controls" onclick="event.stopPropagation()">
                    <button class="btn-3d btn-uk" onclick="speakText('${escapeQuotes(item.natural)}', 'en-GB')">
                        🇬🇧 UK Voice
                    </button>
                    <button class="btn-3d btn-us" onclick="speakText('${escapeQuotes(item.natural)}', 'en-US')">
                        🇺🇸 US Voice
                    </button>
                </div>
                <div class="click-hint">ক্লিক করুন (ধাপ ১/৩)</div>
            `;

            // Card Click Event for 3-step reveal
            card.addEventListener('click', () => {
                let currentStep = parseInt(card.dataset.step);
                const secEn = card.querySelector('.sec-en');
                const secExp = card.querySelector('.sec-exp');
                const hint = card.querySelector('.click-hint');

                if (currentStep === 0) {
                    secEn.style.display = 'block';
                    card.dataset.step = '1';
                    hint.textContent = 'পুনরায় ক্লিক করুন (ধাপ ২/৩)';
                } else if (currentStep === 1) {
                    secExp.style.display = 'block';
                    card.dataset.step = '2';
                    hint.textContent = 'লুকাবার জন্য ক্লিক করুন';
                } else {
                    secEn.style.display = 'none';
                    secExp.style.display = 'none';
                    card.dataset.step = '0';
                    hint.textContent = 'ক্লিক করুন (ধাপ ১/৩)';
                }
            });

            container.appendChild(card);
        });

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        // Web Speech API Text-To-Speech Function
        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop currently playing audio
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9; // Slightly slower speed for clear listening
                window.speechSynthesis.speak(utterance);
            } else {
                alert('আপনার ব্রাউজারে স্পিচ ফিচারটি সাপোর্ট করছে না।');
            }
        }
    </script>
</body>
</html>
