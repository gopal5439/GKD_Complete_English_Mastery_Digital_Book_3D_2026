            text-align: right;
            font-size: 0.78rem;
            color: #94a3b8;

            color: white;

            .controls-panel { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: space-between; }
            .btn-3d { flex: 1; justify-content: center; }

            { id: 21, bn: "সত্যিই অসাধারণ!", std: "It is truly amazing!", nat: "That's amazing!", pron: "দ্যাটস অ্যামেইজিং!", exp: "কোনো চমৎকার ঘটনা বা অর্জনে প্রশংসা প্রকাশ করা হয়।" },
            { id: 22, bn: "আমি তোমার জন্য খুশি।", std: "I am happy for you.", nat: "I'm happy for you.", pron: "আইম হ্যাপি ফর ইউ।", exp: "কারও সাফল্য বা আনন্দের ঘটনায় নিজের আনন্দ প্রকাশ করতে বলা হয়।" },
            { id: 23, bn: "এটা তো প্রত্যাশিতই ছিল।", std: "That was expected.", nat: "I expected that.", pron: "আই ইকস্পেক্টিড দ্যাট।", exp: "আগে থেকেই কোনো ঘটনা ঘটবে বলে ধারণা থাকলে ব্যবহার হয়।" },
            { id: 24, bn: "চিন্তা করার কিছু নেই।", std: "There is nothing to worry about.", nat: "Nothing to worry about.", pron: "নাথিং টু ওয়ারি অ্যাবাউট।", exp: "কাউকে দুশ্চিন্তা না করতে আশ্বস্ত করার জন্য বলা হয়।" },
            { id: 25, bn: "দেখা যাক কী হয়।", std: "Let us see what happens.", nat: "Let's see what happens.", pron: "লেটস সি হোয়াট হ্যাপেনস।", exp: "ভবিষ্যৎ ফলাফল এখনো নিশ্চিত নয়—এমন পরিস্থিতিতে বলা হয়।" }
        ];

        // Track states for cards: 0 = Bangla only, 1 = Natural + Standard + Pron, 2 = Explanation
        const cardStates = {};

        // Render Cards
        function renderCards() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            dataset.forEach(item => {
                cardStates[item.id] = cardStates[item.id] || 0;

                const card = document.createElement('div');
                card.className = `card state-${cardStates[item.id]}`;
                card.id = `card-${item.id}`;
                card.onclick = (e) => handleCardClick(e, item.id);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-num">${item.id}</div>
                        <div class="step-indicator" id="step-ind-${item.id}">
                            ${getStepLabel(cardStates[item.id])}
                        </div>
                    </div>

                    <div class="bangla-box">
                        <div class="bangla-text">${item.bn}</div>
                    </div>

                    <div class="english-section">
                        <div class="english-item">
                            <span class="badge-tag tag-natural">Natural Spoken</span>
                            <div class="english-text">
                                <span>${item.nat}</span>
                                <div class="audio-btns">
                                    <button class="btn-audio" onclick="speakText(event, '${escapeQuotes(item.nat)}', 'en-GB')">🇬🇧 UK</button>
                                    <button class="btn-audio" onclick="speakText(event, '${escapeQuotes(item.nat)}', 'en-US')">🇺🇸 US</button>
                                </div>
                            </div>
                        </div>

                        <div class="english-item">
                            <span class="badge-tag tag-standard">Standard English</span>
                            <div class="standard-text">${item.std}</div>
                        </div>

                        <div class="english-item">
                            <span class="badge-tag tag-pron">উচ্চারণ</span>
                            <div class="pronunciation-text">${item.pron}</div>
                        </div>
                    </div>

                    <div class="explanation-section">
                        <div class="explanation-content">
                            <strong>ব্যাখ্যা:</strong> ${item.exp}
                        </div>
                    </div>

                    <span class="click-hint" id="hint-${item.id}">${getHintText(cardStates[item.id])}</span>
                `;

                container.appendChild(card);
            });
        }

        // Helper functions
        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        function getStepLabel(state) {
            if (state === 0) return 'ক্লিক করুন (১/২)';
            if (state === 1) return 'ক্লিক করুন (২/২)';
            return 'সম্পূর্ণ দেখুন (রিসেট)';
        }

        function getHintText(state) {
            if (state === 0) return '👉 ক্লিক করে ইংরেজি ও উচ্চারণ দেখুন';
            if (state === 1) return '👉 ক্লিক করে ব্যাখ্যা দেখুন';
            return '👈 আবার প্রথম অবস্থায় নিয়ে যেতে ক্লিক করুন';
        }

        // Card Click Handler
        function handleCardClick(e, id) {
            // Prevent triggers when clicking audio buttons
            if (e.target.closest('.btn-audio')) return;

            cardStates[id] = (cardStates[id] + 1) % 3;
            
            const card = document.getElementById(`card-${id}`);
            card.className = `card state-${cardStates[id]}`;
            
            document.getElementById(`step-ind-${id}`).innerText = getStepLabel(cardStates[id]);
            document.getElementById(`hint-${id}`).innerText = getHintText(cardStates[id]);
        }

        // Toggle All Cards
        function toggleAllCards(show) {
            dataset.forEach(item => {
                cardStates[item.id] = show ? 2 : 0;
            });
            renderCards();
        }

        // Text To Speech Function
        function speakText(event, text, lang) {
            event.stopPropagation(); // Stop card flip event

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop ongoing audio

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9; // Slightly slower for clarity

                // Try to find natural voices
                const voices = window.speechSynthesis.getVoices();
                const selectedVoice = voices.find(v => v.lang.includes(lang) || v.lang.replace('_', '-').includes(lang));
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert("দুঃখিত, আপনার ব্রাউজারে টেক্সট-টু-স্পিচ কাজ করছে না।");
            }
        }

        // Search Filter
        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let visibleCount = 0;

            dataset.forEach(item => {
                const card = document.getElementById(`card-${item.id}`);
                const match = item.bn.toLowerCase().includes(query) || 
                              item.nat.toLowerCase().includes(query) || 
                              item.std.toLowerCase().includes(query) ||
                              item.pron.toLowerCase().includes(query);

                if (match) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
        }

        // Load Voices for Chrome / Safari
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Initial Initialization
        renderCards();
    </script>
</body>
</html>
