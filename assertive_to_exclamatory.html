<!DOCTYPE html>
<html lang="bn" data-theme="rgb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assertive to Exclamatory — Complete Master Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --font-bn: 'Tiro Bangla', serif;
    --font-en: 'Poppins', sans-serif;
    --transition-speed: 0.35s;
  }

  /* ================= THEME VARIABLES ================= */
  /* 1. REAL RGB THEME */
  [data-theme="rgb"] {
    --bg-primary: #070913;
    --bg-secondary: #0f1426;
    --card-bg: rgba(18, 24, 46, 0.85);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-1: #00f2fe;
    --accent-2: #ff007f;
    --accent-3: #8a2be2;
    --border-glow: linear-gradient(90deg, #ff0055, #00f2fe, #7000ff, #00ff88, #ff0055);
    --btn-bg: linear-gradient(145deg, #161d38, #0c1021);
    --btn-shadow: 0 8px 0 #04060d, 0 15px 25px rgba(0, 242, 254, 0.25);
    --btn-hover-shadow: 0 12px 0 #04060d, 0 22px 35px rgba(255, 0, 127, 0.45);
    --step-1-bg: rgba(0, 242, 254, 0.12);
    --step-2-bg: rgba(0, 255, 136, 0.14);
    --step-3-bg: rgba(138, 43, 226, 0.16);
    --badge-bg: rgba(255, 0, 127, 0.2);
    --badge-text: #ff66b2;
  }

  /* 2. DARK THEME */
  [data-theme="dark"] {
    --bg-primary: #121212;
    --bg-secondary: #1e1e1e;
    --card-bg: #242424;
    --text-main: #f1f5f9;
    --text-muted: #a1a1aa;
    --accent-1: #38bdf8;
    --accent-2: #818cf8;
    --accent-3: #34d399;
    --border-glow: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
    --btn-bg: linear-gradient(145deg, #2c2c2c, #1f1f1f);
    --btn-shadow: 0 6px 0 #0a0a0a, 0 12px 20px rgba(0,0,0,0.5);
    --btn-hover-shadow: 0 10px 0 #0a0a0a, 0 18px 28px rgba(56, 189, 248, 0.2);
    --step-1-bg: rgba(56, 189, 248, 0.12);
    --step-2-bg: rgba(52, 211, 153, 0.12);
    --step-3-bg: rgba(129, 140, 248, 0.14);
    --badge-bg: rgba(56, 189, 248, 0.15);
    --badge-text: #38bdf8;
  }

  /* 3. WHITE THEME */
  [data-theme="white"] {
    --bg-primary: #f1f5f9;
    --bg-secondary: #ffffff;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #475569;
    --accent-1: #2563eb;
    --accent-2: #7c3aed;
    --accent-3: #059669;
    --border-glow: linear-gradient(90deg, #2563eb, #7c3aed, #059669, #2563eb);
    --btn-bg: linear-gradient(145deg, #ffffff, #e2e8f0);
    --btn-shadow: 0 6px 0 #cbd5e1, 0 12px 20px rgba(15, 23, 42, 0.08);
    --btn-hover-shadow: 0 10px 0 #cbd5e1, 0 18px 25px rgba(37, 99, 235, 0.18);
    --step-1-bg: #eff6ff;
    --step-2-bg: #ecfdf5;
    --step-3-bg: #f5f3ff;
    --badge-bg: #dbeafe;
    --badge-text: #1d4ed8;
  }

  /* ================= GLOBAL RESET & BASE ================= */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-bn), var(--font-en), sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-main);
    min-height: 100vh;
    transition: background-color 0.4s ease, color 0.4s ease;
    overflow-x: hidden;
    padding-bottom: 60px;
  }

  /* Background subtle grid */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(128, 128, 128, 0.12) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  /* ================= HEADER & LASER LINE ================= */
  header {
    text-align: center;
    padding: 30px 20px 25px;
    background: var(--card-bg);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(12px);
    margin-bottom: 28px;
  }

  /* Animated Laser Beam Border */
  .laser-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 4px;
    background: var(--border-glow);
    background-size: 200% 100%;
    animation: laserMove 3s linear infinite;
  }

  .laser-bar-top {
    top: 0;
    bottom: auto;
  }

  @keyframes laserMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  header h1 {
    font-family: var(--font-en);
    font-size: clamp(1.6rem, 3.5vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    background: var(--border-glow);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: laserMove 5s linear infinite;
    margin-bottom: 8px;
  }

  header p {
    font-size: 1.15rem;
    color: var(--text-muted);
    max-width: 720px;
    margin: 0 auto 20px;
  }

  /* ================= 3D TACTILE CONTROLS ================= */
  .top-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 15px;
  }

  .btn-3d {
    font-family: var(--font-bn), var(--font-en);
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
    background: var(--btn-bg);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 11px 22px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: var(--btn-shadow);
    transform: translateY(0);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-3d::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
    transition: left 0.45s ease;
  }

  .btn-3d:hover, .btn-3d:focus-visible {
    transform: translateY(-5px);
    box-shadow: var(--btn-hover-shadow);
    border-color: var(--accent-1);
  }

  .btn-3d:hover::after {
    left: 100%;
  }

  .btn-3d:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
  }

  .btn-3d.active {
    border: 2px solid var(--accent-1);
    color: var(--accent-1);
  }

  /* ================= NAVIGATION TABS ================= */
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .tab-btn {
    font-size: 1.15rem;
    padding: 14px 28px;
  }

  /* ================= STATS & GLOBAL ACTIONS BAR ================= */
  .action-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: var(--card-bg);
    padding: 16px 22px;
    border-radius: 18px;
    margin-bottom: 24px;
    border: 1px solid rgba(128, 128, 128, 0.18);
  }

  .search-box {
    flex: 1;
    min-width: 240px;
    padding: 11px 16px;
    border-radius: 12px;
    border: 1px solid rgba(128, 128, 128, 0.3);
    background: var(--bg-primary);
    color: var(--text-main);
    font-family: var(--font-bn), var(--font-en);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.25s;
  }

  .search-box:focus {
    border-color: var(--accent-1);
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* ================= GRID & 3D INTERACTIVE CARDS ================= */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 22px;
  }

  .master-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(128, 128, 128, 0.2);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    cursor: pointer;
    transform: translateY(0);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .master-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent-1);
    box-shadow: 0 16px 32px rgba(0, 242, 254, 0.15);
  }

  /* Laser sweep on card hover */
  .master-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
    pointer-events: none;
  }

  .master-card:hover::before {
    left: 160%;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
  }

  .card-badge {
    background: var(--badge-bg);
    color: var(--badge-text);
    font-family: var(--font-en);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.4px;
  }

  .click-indicator {
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .step-dots {
    display: inline-flex;
    gap: 4px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(128, 128, 128, 0.35);
    transition: background 0.3s, transform 0.3s;
  }

  .dot.filled {
    background: var(--accent-1);
    transform: scale(1.25);
    box-shadow: 0 0 8px var(--accent-1);
  }

  .main-statement {
    font-family: var(--font-en), var(--font-bn);
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 14px;
    color: var(--text-main);
  }

  .rule-title-bn {
    font-family: var(--font-bn);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent-1);
    margin-bottom: 12px;
  }

  /* ================= REVEAL STEPS ================= */
  .reveal-box {
    display: none;
    padding: 12px 15px;
    border-radius: 12px;
    margin-top: 10px;
    font-size: 1.02rem;
    line-height: 1.6;
    border-left: 4px solid var(--accent-1);
    animation: slideReveal 0.32s ease forwards;
  }

  .reveal-box.visible {
    display: block;
  }

  .step-1 {
    background: var(--step-1-bg);
    border-left-color: var(--accent-1);
  }

  .step-2 {
    background: var(--step-2-bg);
    border-left-color: var(--accent-3);
  }

  .step-3 {
    background: var(--step-3-bg);
    border-left-color: var(--accent-2);
  }

  .reveal-label {
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.85;
    display: block;
    margin-bottom: 4px;
    font-family: var(--font-bn), var(--font-en);
  }

  .en-text {
    font-family: var(--font-en);
    font-weight: 600;
  }

  @keyframes slideReveal {
    from {
      opacity: 0;
      transform: translateY(-8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .card-footer-hint {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed rgba(128, 128, 128, 0.25);
    font-size: 0.9rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .section-hidden {
    display: none;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .grid-container {
      grid-template-columns: 1fr;
    }
    .btn-3d {
      padding: 10px 16px;
      font-size: 0.95rem;
    }
  }
</style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <header>
    <div class="laser-bar laser-bar-top"></div>
    <h1>Assertive → Exclamatory Master Guide</h1>
    <p>সম্পূর্ণ ১৬টি নিয়ম (১২টি মূল + ৪টি অ্যাডভান্সড) এবং SSC, HSC ও প্রতিযোগিতামূলক পরীক্ষার বাছাইকৃত ৫০টি প্রশ্ন। প্রতিটি কার্ডে পরপর ক্লিক করে <strong>অর্থ → উত্তর → বিস্তারিত ব্যাখ্যা</strong> দেখুন।</p>
    
    <!-- THEME SELECTOR -->
    <div class="top-controls" role="group" aria-label="Theme Switcher">
      <button class="btn-3d active" onclick="setTheme('rgb', this)">🌈 Real RGB থিম</button>
      <button class="btn-3d" onclick="setTheme('dark', this)">🌙 Dark থিম</button>
      <button class="btn-3d" onclick="setTheme('white', this)">☀️ White থিম</button>
    </div>
    <div class="laser-bar"></div>
  </header>

  <!-- MAIN NAVIGATION TABS -->
  <div class="nav-tabs">
    <button class="btn-3d tab-btn active" id="tab-rules" onclick="switchTab('rules')">📘 সম্পূর্ণ ১৬টি নিয়ম (Rules)</button>
    <button class="btn-3d tab-btn" id="tab-practice" onclick="switchTab('practice')">🎯 ৫০টি অনুশীলন প্রশ্ন (SSC / HSC / Adv.)</button>
  </div>

  <!-- ================= SECTION 1: 16 RULES ================= -->
  <section id="section-rules">
    <div class="action-toolbar">
      <div class="filter-group">
        <button class="btn-3d active" onclick="filterRules('all', this)">সব নিয়ম (১৬টি)</button>
        <button class="btn-3d" onclick="filterRules('core', this)">মূল নিয়ম (১–১২)</button>
        <button class="btn-3d" onclick="filterRules('adv', this)">অ্যাডভান্সড (১৩–১৬)</button>
      </div>
      <div class="filter-group">
        <button class="btn-3d" onclick="revealAllRules()">👁️ সব ধাপ খুলুন</button>
        <button class="btn-3d" onclick="resetAllRules()">🔄 রিসেট করুন</button>
      </div>
    </div>

    <div class="grid-container" id="rules-grid"></div>
  </section>

  <!-- ================= SECTION 2: 50 PRACTICE QUESTIONS ================= -->
  <section id="section-practice" class="section-hidden">
    <div class="action-toolbar">
      <input type="text" id="search-input" class="search-box" placeholder="বাক্য, অর্থ বা নিয়ম লিখে খুঁজুন..." oninput="renderPractice()">
      <div class="filter-group">
        <button class="btn-3d active" onclick="filterPractice('all', this)">সব (৫০টি)</button>
        <button class="btn-3d" onclick="filterPractice('SSC', this)">SSC লেভেল</button>
        <button class="btn-3d" onclick="filterPractice('HSC', this)">HSC লেভেল</button>
        <button class="btn-3d" onclick="filterPractice('Advanced', this)">Advanced / BCS</button>
      </div>
      <div class="filter-group">
        <button class="btn-3d" onclick="revealAllPractice()">👁️ সব উত্তর ও ব্যাখ্যা</button>
        <button class="btn-3d" onclick="resetAllPractice()">🔄 রিসেট</button>
      </div>
    </div>

    <div class="grid-container" id="practice-grid"></div>
  </section>
</div>

<script>
  /* ================= DATA: ALL 16 RULES ================= */
  const rulesData = [
    {
      id: 1,
      type: "core",
      badge: "Rule 01 • Core",
      title: "‘A / An’ যুক্ত Assertive Sentence (Very / Great থাকলে)",
      step1_label: "১ম ক্লিক — বাক্যের গঠন (Structure)",
      step1: "What a / What an + adjective + noun + subject + verb + ! (বাক্যের very বা great উঠে যায়)।",
      step2_label: "২য় ক্লিক — উদাহরণ (Example)",
      step2: "Assertive: It is a very nice bird.\nExclamatory: What a nice bird it is!",
      step3_label: "৩য় ক্লিক — বিস্তারিত ব্যাখ্যা ও টিপস",
      step3: "বাক্যে article (a/an) থাকলে এবং তারপরে very বা great থাকলে অবশ্যই What a বা What an দিয়ে শুরু করতে হবে। Adjective-এর প্রথম অক্ষর vowel sound হলে What an বসবে।"
    },
    {
      id: 2,
      type: "core",
      badge: "Rule 02 • Core",
      title: "‘A / An’ ছাড়া Assertive Sentence (Very / Great / So থাকলে)",
      step1_label: "১ম ক্লিক — বাক্যের গঠন (Structure)",
      step1: "How + adjective / adverb + subject + verb + ! (very, great বা so উঠে যায়)।",
      step2_label: "২য় ক্লিক — উদাহরণ (Example)",
      step2: "Assertive: The girl is very clever.\nExclamatory: How clever the girl is!",
      step3_label: "৩য় ক্লিক — বিস্তারিত ব্যাখ্যা ও টিপস",
      step3: "যদি adjective বা adverb-এর আগে কোনো article (a/an) না থাকে, তবে What-এর বদলে How দিয়ে বাক্য শুরু করতে হয় এবং Subject + Verb একেবারে শেষে বসে।"
    },
    {
      id: 3,
      type: "core",
      badge: "Rule 03 • Core",
      title: "ইচ্ছা বা আকাঙ্ক্ষা প্রকাশক বাক্য (I wish / I desire থাকলে)",
      step1_label: "১ম ক্লিক — বাক্যের গঠন (Structure)",
      step1: "If / Had / Would that / O that + subject + বাকি অংশ + !",
      step2_label: "২য় ক্লিক — উদাহরণ (Example)",
      step2: "Assertive: I wish I were a king.\nExclamatory: If I were a king! (অথবা: Were I a king!)",
      step3_label: "৩য় ক্লিক — বিস্তারিত ব্যাখ্যা ও টিপস",
      step3: "অবাস্তব কল্পনা বা তীব্র ইচ্ছা বোঝাতে I wish উঠে গিয়ে শুরুতে If, Had বা Would that বসে। মূল বাক্যে had থাকলে সরাসরি Had দিয়েও বাক্য শুরু করা যায় (যেমন: Had I the wings of a bird!)।"
    },
    {
      id: 4,
      type: "core",
      badge: "Rule 04 • Core",
      title: "আনন্দ বা উচ্ছ্বাস প্রকাশক বাক্য (Matter of joy / Rejoice)",
      step1_label: "১ম ক্লিক — বাক্যের গঠন (Structure)",
      step1: "Hurrah! / Bravo! + that-এর পরের মূল বাক্য + !",
      step2_label: "২য় ক্লিক — উদাহরণ (Example)",

  /* ================= STATE TRACKERS ================= */
  let currentRuleFilter = "all";
  let currentPracticeFilter = "all";
  const ruleClicks = {};     // stores 0, 1, 2, 3
  const practiceClicks = {}; // stores 0, 1, 2, 3

  /* ================= THEME & TAB FUNCTIONS ================= */
  function setTheme(themeName, btnElement) {
    document.documentElement.setAttribute('data-theme', themeName);
    document.querySelectorAll('.top-controls .btn-3d').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
  }

  function switchTab(tabName) {
    const rulesSec = document.getElementById('section-rules');
    const practiceSec = document.getElementById('section-practice');
    const tabRulesBtn = document.getElementById('tab-rules');
    const tabPracticeBtn = document.getElementById('tab-practice');

    if (tabName === 'rules') {
      rulesSec.classList.remove('section-hidden');
      practiceSec.classList.add('section-hidden');
      tabRulesBtn.classList.add('active');
      tabPracticeBtn.classList.remove('active');
    } else {
      rulesSec.classList.add('section-hidden');
      practiceSec.classList.remove('section-hidden');
      tabRulesBtn.classList.remove('active');
      tabPracticeBtn.classList.add('active');
    }
  }

  /* ================= RULES RENDERING & MULTI-CLICK ================= */
  function filterRules(type, btn) {
    currentRuleFilter = type;
    btn.parentElement.querySelectorAll('.btn-3d').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderRules();
  }

  function handleRuleClick(id) {
    const current = ruleClicks[id] || 0;
    ruleClicks[id] = (current + 1) % 4; // Cycles 0 -> 1 -> 2 -> 3 -> 0
    renderRules();
  }

  function revealAllRules() {
    rulesData.forEach(r => ruleClicks[r.id] = 3);
    renderRules();
  }

  function resetAllRules() {
    rulesData.forEach(r => ruleClicks[r.id] = 0);
    renderRules();
  }

  function renderRules() {
    const grid = document.getElementById('rules-grid');
    grid.innerHTML = "";

    const filtered = rulesData.filter(r => currentRuleFilter === "all" || r.type === currentRuleFilter);

    filtered.forEach(rule => {
      const step = ruleClicks[rule.id] || 0;
      const hints = [
        "👆 ১ম ক্লিক: গঠন (Structure) দেখুন",
        "👆 ২য় ক্লিক: উদাহরণ (Example) দেখুন",
        "👆 ৩য় ক্লিক: বিস্তারিত ব্যাখ্যা দেখুন",
        "🔄 আবার ক্লিক করলে বন্ধ হবে"
      ];

      const card = document.createElement('div');
      card.className = 'master-card';
      card.onclick = () => handleRuleClick(rule.id);

      card.innerHTML = `
        <div>
          <div class="card-header">
            <span class="card-badge">${rule.badge}</span>
            <div class="click-indicator">
              <span>ধাপ ${step}/3</span>
              <div class="step-dots">
                <span class="dot ${step >= 1 ? 'filled' : ''}"></span>
                <span class="dot ${step >= 2 ? 'filled' : ''}"></span>
                <span class="dot ${step >= 3 ? 'filled' : ''}"></span>
              </div>
            </div>
          </div>
          <div class="rule-title-bn">${rule.id}. ${rule.title}</div>

          <div class="reveal-box step-1 ${step >= 1 ? 'visible' : ''}">
            <span class="reveal-label">${rule.step1_label}</span>
            <div class="en-text">${rule.step1}</div>
          </div>

          <div class="reveal-box step-2 ${step >= 2 ? 'visible' : ''}">
            <span class="reveal-label">${rule.step2_label}</span>
            <div class="en-text" style="white-space: pre-line;">${rule.step2}</div>
          </div>

          <div class="reveal-box step-3 ${step >= 3 ? 'visible' : ''}">
            <span class="reveal-label">${rule.step3_label}</span>
            <div>${rule.step3}</div>
          </div>
        </div>

        <div class="card-footer-hint">
          <span>${hints[step]}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  /* ================= PRACTICE RENDERING & MULTI-CLICK ================= */
  function filterPractice(level, btn) {
    currentPracticeFilter = level;
    btn.parentElement.querySelectorAll('.btn-3d').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPractice();
  }

  function handlePracticeClick(id) {
    const current = practiceClicks[id] || 0;
    practiceClicks[id] = (current + 1) % 4; // Cycles 0 -> 1 -> 2 -> 3 -> 0
    renderPractice();
  }

  function revealAllPractice() {
    practiceData.forEach(p => practiceClicks[p.id] = 3);
    renderPractice();
  }

  function resetAllPractice() {
    practiceData.forEach(p => practiceClicks[p.id] = 0);
    renderPractice();
  }

  function renderPractice() {
    const grid = document.getElementById('practice-grid');
    const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
    grid.innerHTML = "";

    const filtered = practiceData.filter(item => {
      const matchLevel = currentPracticeFilter === "all" || item.level === currentPracticeFilter;
      const matchText = !searchQuery || 
        item.q.toLowerCase().includes(searchQuery) || 
        item.meaning.includes(searchQuery) || 
        item.ans.toLowerCase().includes(searchQuery) ||
        item.ruleRef.toLowerCase().includes(searchQuery);
      return matchLevel && matchText;
    });

    filtered.forEach(item => {
      const step = practiceClicks[item.id] || 0;
      const hints = [
        "👆 ১ম ক্লিক: বাংলা অর্থ দেখুন",
        "👆 ২য় ক্লিক: সঠিক উত্তর দেখুন",
        "👆 ৩য় ক্লিক: বিস্তারিত ব্যাখ্যা দেখুন",
        "🔄 আবার ক্লিক করলে রিসেট হবে"
      ];

      const card = document.createElement('div');
      card.className = 'master-card';
      card.onclick = () => handlePracticeClick(item.id);

      card.innerHTML = `
        <div>
          <div class="card-header">
            <span class="card-badge">#${item.id} • ${item.level} (${item.ruleRef})</span>
            <div class="click-indicator">
              <span>ধাপ ${step}/3</span>
              <div class="step-dots">
                <span class="dot ${step >= 1 ? 'filled' : ''}"></span>
                <span class="dot ${step >= 2 ? 'filled' : ''}"></span>
                <span class="dot ${step >= 3 ? 'filled' : ''}"></span>
              </div>
            </div>
          </div>

          <div class="main-statement">${item.q}</div>

          <!-- STEP 1: BENGALI MEANING -->
          <div class="reveal-box step-1 ${step >= 1 ? 'visible' : ''}">
            <span class="reveal-label">১ম ক্লিক — বাংলা অর্থ (Meaning)</span>
            <div>${item.meaning}</div>
          </div>

          <!-- STEP 2: CORRECT ANSWER -->
          <div class="reveal-box step-2 ${step >= 2 ? 'visible' : ''}">
            <span class="reveal-label">২য় ক্লিক — সঠিক উত্তর (Exclamatory)</span>
            <div class="en-text" style="font-size: 1.1rem;">${item.ans}</div>
          </div>

          <!-- STEP 3: DETAILED EXPLANATION -->
          <div class="reveal-box step-3 ${step >= 3 ? 'visible' : ''}">
            <span class="reveal-label">৩য় ক্লিক — বিস্তারিত ব্যাখ্যা (Explanation)</span>
            <div>${item.exp}</div>
          </div>
        </div>

        <div class="card-footer-hint">
          <span>${hints[step]}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Initial Render
  renderRules();
  renderPractice();
</script>
</body>
</html>
