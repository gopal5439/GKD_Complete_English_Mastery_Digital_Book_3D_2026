                bn: "তুমি কি আমার সঙ্গে একটু কথা বলতে পারবে?",
                en: "Could you talk to me for a moment?",
                pron: "কুড ইউ টক টু মি ফর আ মোমেন্ট?",
                exp: "কারও কাছে অল্প সময় কথা বলার অনুরোধ জানাতে এটি বলা হয়। For a moment অর্থ অল্প সময়ের জন্য।"
            },
            {
                id: 373,
                bn: "তোমার উচিত নিজের যত্ন নেওয়া।",
                en: "You should take care of yourself.",
                pron: "ইউ শুড টেক কেয়ার অভ ইয়োরসেল্ফ।",
                exp: "কাউকে নিজের শরীর ও মনের যত্ন নেওয়ার পরামর্শ দিতে বাক্যটি ব্যবহার করা হয়। Take care of অর্থ যত্ন নেওয়া।"
            },
            {
                id: 374,
                bn: "দয়া করে বিষয়টি কাউকে বলো না।",
                en: "Please don't tell anyone about it.",
                pron: "প্লিজ ডোন্ট টেল এনিওয়ান অ্যাবাউট ইট।",
                exp: "কোনো বিষয় গোপন রাখার অনুরোধ জানাতে বাক্যটি ব্যবহার করা হয়। Anyone এখানে নেতিবাচক বাক্যে কাউকে বা কোনো ব্যক্তিকে বোঝায়।"
            },
            {
                id: 375,
                bn: "তুমি চাইলে আমার পরামর্শ নিতে পারো।",
                en: "You can take my advice if you want.",
                pron: "ইউ ক্যান টেক মাই অ্যাডভাইস ইফ ইউ ওয়ান্ট।",
                exp: "কাউকে নিজের পরামর্শ গ্রহণের সুযোগ দিতে বাক্যটি বলা হয়। Take my advice অর্থ আমার পরামর্শ গ্রহণ করা।"
            }
        ];

        // Track states for cards (0: Initial/Bengali, 1: English+Pronunciation, 2: Explanation)
        const cardStates = {};

        // Numbers in Bengali
        const toBengaliNum = (num) => {
            const symbols = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
            return num.toString().split('').map(d => symbols[d] || d).join('');
        };

        // Render all cards
        function renderCards(filterText = "") {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            const filteredData = sentenceData.filter(item => {
                const query = filterText.toLowerCase().trim();
                return item.bn.toLowerCase().includes(query) || 
                       item.en.toLowerCase().includes(query) || 
                       item.pron.toLowerCase().includes(query) ||
                       item.id.toString().includes(query);
            });

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 font-bangla">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 text-purple-400"></i>
                        <p>কোনো বাক্য খুঁজে পাওয়া যায়নি!</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach(item => {
                cardStates[item.id] = cardStates[item.id] || 0;
                const currentState = cardStates[item.id];

                const cardHtml = `
                    <div id="card-${item.id}" class="card-3d rounded-2xl p-6 flex flex-col justify-between cursor-pointer" onclick="handleCardClick(event, ${item.id})">
                        
                        <div>
                            <!-- Header Info -->
                            <div class="flex items-center justify-between mb-4 border-b border-slate-700/50 pb-3">
                                <span class="text-xs font-bold px-3 py-1 rounded-full step-badge text-purple-300 font-sans flex items-center gap-1">
                                    <i class="fa-solid fa-hashtag text-[10px]"></i> বাক্য ${toBengaliNum(item.id)}
                                </span>
                                <span class="text-xs text-slate-400 font-sans" id="state-indicator-${item.id}">
                                    ${getStateText(currentState)}
                                </span>
                            </div>

                            <!-- Step 0: Bengali Sentence -->
                            <div class="mb-4">
                                <div class="text-xs text-purple-400 font-sans uppercase font-bold tracking-wider mb-1">বাংলা</div>
                                <p class="font-bangla text-2xl text-slate-100 font-semibold leading-relaxed">
                                    ${item.bn}
                                </p>
                            </div>

                            <!-- Step 1 Reveal: English & Pronunciation -->
                            <div id="english-box-${item.id}" class="reveal-box ${currentState >= 1 ? 'show' : ''}">
                                <div class="p-4 rounded-xl bg-slate-900/60 border border-slate-700/60 mb-4 space-y-3">
                                    <div>
                                        <div class="flex items-center justify-between mb-1">
                                            <span class="text-xs text-purple-400 font-sans uppercase font-bold tracking-wider">English</span>
                                            <!-- Speech buttons -->
                                            <div class="flex gap-2" onclick="event.stopPropagation()">
                                                <button onclick="speakText('${escapeQuotes(item.en)}', 'en-US')" title="US Pronunciation" class="btn-3d btn-speech-us text-white text-xs px-2.5 py-1 rounded-lg flex items-center gap-1">
                                                    <i class="fa-solid fa-volume-high"></i> <span class="font-sans font-bold">🇺🇸 US</span>
                                                </button>
                                                <button onclick="speakText('${escapeQuotes(item.en)}', 'en-GB')" title="UK Pronunciation" class="btn-3d btn-speech-uk text-white text-xs px-2.5 py-1 rounded-lg flex items-center gap-1">
                                                    <i class="fa-solid fa-volume-high"></i> <span class="font-sans font-bold">🇬🇧 UK</span>
                                                </button>
                                            </div>
                                        </div>
                                        <p class="font-english text-2xl text-purple-200 tracking-wide font-normal">
                                            ${item.en}
                                        </p>
                                    </div>

                                    <div class="pt-2 border-t border-slate-800">
                                        <span class="text-xs text-pink-400 font-sans uppercase font-bold tracking-wider block mb-0.5">উচ্চারণ</span>
                                        <p class="font-bangla text-lg text-pink-200">
                                            ${item.pron}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <!-- Step 2 Reveal: Explanation -->
                            <div id="explanation-box-${item.id}" class="reveal-box ${currentState >= 2 ? 'show' : ''}">
                                <div class="p-4 rounded-xl bg-purple-950/30 border border-purple-500/30">
                                    <span class="text-xs text-purple-300 font-sans uppercase font-bold tracking-wider block mb-1">
                                        <i class="fa-solid fa-lightbulb mr-1"></i>ব্যাখ্যা ও ব্যাকরণ
                                    </span>
                                    <p class="font-bangla text-base text-purple-100 leading-relaxed">
                                        ${item.exp}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Card Action Button Footer -->
                        <div class="mt-5 pt-3 border-t border-slate-700/40 flex justify-between items-center" onclick="event.stopPropagation()">
                            <button onclick="cycleCardState(${item.id})" class="btn-3d btn-step text-white text-sm px-4 py-2 rounded-xl font-bangla w-full flex items-center justify-center gap-2">
                                <span id="btn-text-${item.id}">${getButtonText(currentState)}</span>
                                <i id="btn-icon-${item.id}" class="${getButtonIcon(currentState)} text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            updateProgress();
        }

        // Filter cards by search term
        function filterCards() {
            const query = document.getElementById('search-input').value;
            renderCards(query);
        }

        // Cycle Card State
        function cycleCardState(id) {
            cardStates[id] = (cardStates[id] + 1) % 3;
            updateCardUI(id);
            updateProgress();
        }

        function handleCardClick(event, id) {
            if (event.target.closest('button')) return;
            cycleCardState(id);
        }

        // Helper text generator
        function getStateText(state) {
            if (state === 0) return '<span class="text-slate-400"><i class="fa-solid fa-circle-dot text-[8px] text-purple-400"></i> ধাপ ১/৩</span>';
            if (state === 1) return '<span class="text-purple-400"><i class="fa-solid fa-circle-dot text-[8px] text-purple-400"></i> ধাপ ২/৩</span>';
            return '<span class="text-pink-300"><i class="fa-solid fa-circle-check text-[10px] text-pink-300"></i> সম্পন্ন</span>';
        }

        function getButtonText(state) {
            if (state === 0) return "ইংরেজি ও উচ্চারণ দেখুন";
            if (state === 1) return "ব্যাখ্যা দেখুন";
            return "পুনরায় শুরু করুন";
        }

        function getButtonIcon(state) {
            if (state === 0) return "fa-solid fa-chevron-down";
            if (state === 1) return "fa-solid fa-book-open";
            return "fa-solid fa-rotate-left";
        }

        // Update single card UI
        function updateCardUI(id) {
            const state = cardStates[id];
            
            const engBox = document.getElementById(`english-box-${id}`);
            const expBox = document.getElementById(`explanation-box-${id}`);
            const stateIndicator = document.getElementById(`state-indicator-${id}`);
            const btnText = document.getElementById(`btn-text-${id}`);
            const btnIcon = document.getElementById(`btn-icon-${id}`);

            if (!engBox) return;

            if (state >= 1) {
                engBox.classList.add('show');
            } else {
                engBox.classList.remove('show');
            }

            if (state >= 2) {
                expBox.classList.add('show');
            } else {
                expBox.classList.remove('show');
            }

            stateIndicator.innerHTML = getStateText(state);
            btnText.innerText = getButtonText(state);
            btnIcon.className = `${getButtonIcon(state)} text-xs`;
        }

        // Update Overall Progress
        function updateProgress() {
            const revealedCount = Object.values(cardStates).filter(s => s > 0).length;
            const percentage = (revealedCount / sentenceData.length) * 100;
            
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${toBengaliNum(revealedCount)} / ${toBengaliNum(sentenceData.length)} উন্মোচিত`;
        }

        // Global Action: Reveal stage 1 or stage 2 for all
        function revealAll(targetState) {
            sentenceData.forEach(item => {
                cardStates[item.id] = targetState;
                updateCardUI(item.id);
            });
            updateProgress();
        }

        // Global Action: Reset
        function resetAll() {
            sentenceData.forEach(item => {
                cardStates[item.id] = 0;
                updateCardUI(item.id);
            });
            document.getElementById('search-input').value = '';
            renderCards();
            updateProgress();
            window.speechSynthesis.cancel();
        }

        // Escape double quotes for inline event handling
        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Speech Synthesis Feature
        function speakText(text, langCode) {
            if (!('speechSynthesis' in window)) {
                alert("দুঃখিত! আপনার ব্রাউজারে ভয়েস টেক্সট-টু-স্পিচ সাপোর্টেড নয়।");
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            utterance.rate = 0.9;

            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                const targetVoice = voices.find(v => v.lang === langCode || v.lang.startsWith(langCode.split('-')[0]));
                if (targetVoice) utterance.voice = targetVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Load voices dynamically
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Initialize App
        window.onload = function() {
            renderCards();
        };
    </script>
</body>
</html>
