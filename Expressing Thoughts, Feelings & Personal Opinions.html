    .btn-3d {

    .glass-card {

    .card-content-enter {
      max-height: 0px;

      max-height: 600px;
      opacity: 1;
      transform: translateY(0);

      {
        id: 24,
        bangla: "আমার পরামর্শ হলো, হাল ছেড়ো না।",
        stdEng: "My advice is not to give up.",
        natEng: "My advice? Don't give up.",
        pronunciation: "মাই অ্যাডভাইস? ডোন্ট গিভ আপ।",
        explanation: "কাউকে চেষ্টা চালিয়ে যেতে উৎসাহ দিতে ব্যবহার হয়।"
      },
      {
        id: 25,
        bangla: "আমার মনে হয় এটাই সবচেয়ে ভালো উপায়।",
        stdEng: "I think this is the best way.",
        natEng: "I reckon this is the best way.",
        pronunciation: "আই রেকন দিস ইজ দ্য বেস্ট ওয়ে।",
        explanation: "“I reckon” ব্রিটিশ ইংরেজি ও অস্ট্রেলিয়ান ইংরেজিতে প্রচলিত কথ্য expression। এর অর্থ আমার ধারণা বা আমার মনে হয়।"
      }
    ];

    // Card state tracking: step 0 = Bangla only, step 1 = English + Pronunciation, step 2 = Full details
    const cardStates = {};
    itemsData.forEach(item => cardStates[item.id] = 0);

    let selectedAccent = 'en-US'; // Default US accent
    let allExpanded = false;

    // Convert digits to Bengali numbers
    function toBengaliNumeral(num) {
      const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return num.toString().split('').map(d => bnDigits[d] || d).join('');
    }

    // Render all cards
    function renderCards(filterText = '') {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      let visibleCount = 0;

      itemsData.forEach(item => {
        const matchesFilter = 
          item.bangla.toLowerCase().includes(filterText.toLowerCase()) ||
          item.stdEng.toLowerCase().includes(filterText.toLowerCase()) ||
          item.natEng.toLowerCase().includes(filterText.toLowerCase()) ||
          item.pronunciation.toLowerCase().includes(filterText.toLowerCase());

        if (!matchesFilter) return;

        visibleCount++;
        const state = cardStates[item.id];
        const isEnglishVisible = state >= 1;
        const isExpVisible = state >= 2;

        const cardHTML = `
          <div id="card-${item.id}" class="glass-card rounded-3xl p-5 sm:p-6 transition-all duration-300 relative overflow-hidden flex flex-col justify-between">
            <!-- Card Header & Main Bangla -->
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="inline-flex items-center justify-center w-9 h-9 rounded-2xl bg-indigo-600 text-white font-bold text-sm shadow-md">
                  ${toBengaliNumeral(item.id)}
                </span>

                <div class="flex items-center gap-2">
                  <!-- Step indicator dots -->
                  <div class="flex gap-1.5 items-center">
                    <span class="w-2.5 h-2.5 rounded-full ${state >= 0 ? 'bg-indigo-500' : 'bg-slate-300 dark:bg-slate-700'}"></span>
                    <span class="w-2.5 h-2.5 rounded-full ${state >= 1 ? 'bg-emerald-500' : 'bg-slate-300 dark:bg-slate-700'}"></span>
                    <span class="w-2.5 h-2.5 rounded-full ${state >= 2 ? 'bg-amber-500' : 'bg-slate-300 dark:bg-slate-700'}"></span>
                  </div>
                </div>
              </div>

              <!-- Bangla Prompt -->
              <div class="mb-4 cursor-pointer" onclick="cycleCardState(${item.id})">
                <p class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider mb-1">
                  বাংলা বাক্য
                </p>
                <h3 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100 leading-relaxed font-bangla">
                  ${item.bangla}
                </h3>
              </div>

              <!-- Reveal Step 1: English & Pronunciation -->
              <div class="card-content-enter ${isEnglishVisible ? 'card-content-visible' : ''}">
                <div class="mt-4 pt-4 border-t border-slate-200/80 dark:border-slate-700/80 space-y-3">
                  
                  <!-- Standard English -->
                  <div class="bg-slate-50 dark:bg-slate-800/60 p-3 rounded-2xl border border-slate-200/60 dark:border-slate-700/60">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Standard English</span>
                      <button onclick="event.stopPropagation(); speakText('${escapeQuotes(item.stdEng)}')" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 p-1 rounded-lg" title="উচ্চারণ শুনুন">
                        <i class="fa-solid fa-volume-high text-sm"></i>
                      </button>
                    </div>
                    <p class="text-base sm:text-lg font-semibold text-slate-700 dark:text-slate-200 font-english mt-0.5">
                      ${item.stdEng}
                    </p>
                  </div>

                  <!-- Natural Spoken English -->
                  <div class="bg-indigo-50/70 dark:bg-indigo-950/40 p-3 rounded-2xl border border-indigo-100 dark:border-indigo-900/50">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">Natural Spoken English</span>
                      <button onclick="event.stopPropagation(); speakText('${escapeQuotes(item.natEng)}')" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 p-1 rounded-lg" title="উচ্চারণ শুনুন">
                        <i class="fa-solid fa-volume-high text-base"></i>
                      </button>
                    </div>
                    <p class="text-lg sm:text-xl font-bold text-indigo-900 dark:text-indigo-200 font-english mt-0.5 cursor-pointer hover:underline" onclick="event.stopPropagation(); speakText('${escapeQuotes(item.natEng)}')">
                      ${item.natEng}
                    </p>
                  </div>

                  <!-- Pronunciation -->
                  <div class="bg-emerald-50/70 dark:bg-emerald-950/30 p-3 rounded-2xl border border-emerald-100 dark:border-emerald-900/40">
                    <span class="text-xs font-bold text-emerald-700 dark:text-emerald-400">বাংলা উচ্চারণ</span>
                    <p class="text-base sm:text-lg font-semibold text-emerald-900 dark:text-emerald-200 font-english mt-0.5">
                      ${item.pronunciation}
                    </p>
                  </div>

                </div>
              </div>

              <!-- Reveal Step 2: Detailed Explanation -->
              <div class="card-content-enter ${isExpVisible ? 'card-content-visible' : ''}">
                <div class="mt-3 bg-amber-50/80 dark:bg-amber-950/30 p-3.5 rounded-2xl border border-amber-200/80 dark:border-amber-900/40 text-amber-900 dark:text-amber-200">
                  <div class="flex items-center gap-2 mb-1">
                    <i class="fa-solid fa-lightbulb text-amber-500 text-sm"></i>
                    <span class="text-xs font-bold uppercase tracking-wider text-amber-700 dark:text-amber-400">ব্যাখ্যা ও টিপস</span>
                  </div>
                  <p class="text-sm sm:text-base leading-relaxed font-bangla">
                    ${item.explanation}
                  </p>
                </div>
              </div>
            </div>

            <!-- Card Bottom Tactile 3D Action Button -->
            <div class="mt-5 pt-3">
              <button 
                onclick="cycleCardState(${item.id})" 
                class="w-full btn-3d ${getButtonClass(state)} text-white font-bold py-2.5 px-4 rounded-2xl text-xs sm:text-sm flex items-center justify-center gap-2 cursor-pointer transition-all">
                <i class="${getButtonIcon(state)}"></i>
                <span>${getButtonText(state)}</span>
              </button>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });

      document.getElementById('visibleCount').innerText = visibleCount;
    }

    // Helper for escaping single quotes in speech parameters
    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'");
    }

    // Button status styling
    function getButtonClass(state) {
      if (state === 0) return 'btn-3d-indigo';
      if (state === 1) return 'btn-3d-emerald';
      return 'btn-3d-rose';
    }

    function getButtonIcon(state) {
      if (state === 0) return 'fa-solid fa-eye';
      if (state === 1) return 'fa-solid fa-book-open';
      return 'fa-solid fa-rotate-left';
    }

    function getButtonText(state) {
      if (state === 0) return 'ইংরেজি ও উচ্চারণ দেখুন';
      if (state === 1) return 'ব্যাখ্যা দেখুন';
      return 'পুনরায় রিসেট করুন (সংক্ষেপ)';
    }

    // Cycle individual card steps
    function cycleCardState(id) {
      cardStates[id] = (cardStates[id] + 1) % 3;
      renderCards(document.getElementById('searchInput').value);
    }

    // Toggle All Cards Step
    function toggleAllCards() {
      allExpanded = !allExpanded;
      const targetState = allExpanded ? 2 : 0;
      
      itemsData.forEach(item => {
        cardStates[item.id] = targetState;
      });

      document.getElementById('expandText').innerText = allExpanded ? 'সব সংক্ষেপ করুন' : 'সব খুলুন';
      document.getElementById('expandIcon').className = allExpanded ? 'fa-solid fa-compress' : 'fa-solid fa-layer-group';
      
      renderCards(document.getElementById('searchInput').value);
    }

    // Speech Accent Switcher
    function toggleAccent() {
      if (selectedAccent === 'en-US') {
        selectedAccent = 'en-GB';
        document.getElementById('accentLabel').innerText = 'Accent: UK 🇬🇧';
      } else {
        selectedAccent = 'en-US';
        document.getElementById('accentLabel').innerText = 'Accent: US 🇺🇸';
      }
    }

    // Web Speech API - Text to Speech Pronunciation
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert('দুঃখিত, আপনার ব্রাউজারে টেক্সট-টু-স্পিচ সমর্থিত নয়।');
        return;
      }

      window.speechSynthesis.cancel(); // Stop ongoing speech

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = selectedAccent;
      utterance.rate = 0.9; // Slightly natural pace
      utterance.pitch = 1.0;

      // Select matching voice if available
      const voices = window.speechSynthesis.getVoices();
      const matchedVoice = voices.find(v => v.lang.includes(selectedAccent) || v.lang.replace('_', '-').includes(selectedAccent));
      if (matchedVoice) {
        utterance.voice = matchedVoice;
      }

      // Toast Notification
      showToast(text);

      window.speechSynthesis.speak(utterance);
    }

    function showToast(text) {
      const toast = document.getElementById('audioToast');
      const toastText = document.getElementById('toastText');
      const toastTitle = document.getElementById('toastTitle');

      toastTitle.innerText = selectedAccent === 'en-US' ? 'উচ্চারণ (US 🇺🇸)...' : 'উচ্চারণ (UK 🇬🇧)...';
      toastText.innerText = `"${text}"`;

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3000);
    }

    // Search/Filter function
    function filterCards() {
      const query = document.getElementById('searchInput').value;
      renderCards(query);
    }

    // Dark Mode Toggle
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    // Initialize App
    window.onload = () => {
      renderCards();
      // Pre-load voices for Speech Synthesis
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    };
  </script>
</body>
</html>
