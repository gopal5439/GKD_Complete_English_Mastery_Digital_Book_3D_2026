<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casual Conversations with Friends - English Learning Cards</title>
    
    <!-- Google Fonts: Tiro Bangla -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom Font Definitions */
        .font-bangla {
            font-family: 'Tiro Bangla', serif;
        }
        
        .font-english {
            font-family: 'Times New Roman', Times, serif;
        }

        /* Deep Glowing Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0284c7);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #f8fafc;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card Container with 3D Depth */
        .card-3d {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-3d:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.3);
        }

        /* 3D Tactile Push Button Effect */
        .btn-3d {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 0.75rem;
            transition: all 0.1s ease;
            cursor: pointer;
            user-select: none;
            outline: none;
        }

        /* UK Button Color & Shadow */
        .btn-uk {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 0 #1e40af, 0 10px 15px rgba(0, 0, 0, 0.3);
            color: #ffffff;
            border: 1px solid #60a5fa;
        }

        .btn-uk:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e40af, 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* US Button Color & Shadow */
        .btn-us {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 6px 0 #991b1b, 0 10px 15px rgba(0, 0, 0, 0.3);
            color: #ffffff;
            border: 1px solid #f87171;
        }

        .btn-us:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #991b1b, 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Next / Toggle Step Button */
        .btn-step {
            background: linear-gradient(135deg, #0d9488, #0f766e);
            box-shadow: 0 6px 0 #115e59, 0 10px 15px rgba(0, 0, 0, 0.3);
            color: #ffffff;
            border: 1px solid #2dd4bf;
        }

        .btn-step:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #115e59, 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Smooth Reveal Transitions */
        .reveal-box {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(-10px);
        }

        .reveal-box.active {
            opacity: 1;
            max-height: 300px;
            transform: translateY(0);
        }

        /* Step Indicator Badge */
        .badge-step {
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2), 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="p-3 sm:p-6 md:p-10">

    <!-- Header Section -->
    <header class="max-w-6xl mx-auto text-center mb-10 mt-4">
        <div class="inline-block p-2 px-4 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 font-semibold mb-3 tracking-wider text-sm shadow-inner">
            <i class="fa-solid fa-graduation-cap mr-2"></i>ENGLISH SPOKEN PRACTICE
        </div>
        
        <h1 class="font-english text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-200 to-indigo-200 drop-shadow-md mb-3">
            TOPIC 01: Casual Conversations with Friends
        </h1>
        
        <h2 class="font-bangla text-2xl sm:text-3xl md:text-4xl text-amber-300 font-medium drop-shadow-sm mb-6">
            বন্ধুদের সঙ্গে স্বাভাবিক ও অনানুষ্ঠানিক কথোপকথন
        </h2>

        <!-- Global Control Bar -->
        <div class="flex flex-wrap items-center justify-center gap-4 bg-slate-800/60 p-4 rounded-2xl border border-slate-700/80 backdrop-blur-md max-w-2xl mx-auto shadow-2xl">
            <button onclick="expandAllCards()" class="btn-3d bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 text-sm font-bangla border-b-4 border-indigo-800 active:border-b-0 active:translate-y-1 rounded-xl">
                <i class="fa-solid fa-eye mr-2"></i>সবগুলো প্রকাশ করুন
            </button>
            <button onclick="resetAllCards()" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 text-sm font-bangla border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 rounded-xl">
                <i class="fa-solid fa-rotate-left mr-2"></i>পুনরায় রিসেট করুন
            </button>
            <div class="text-xs text-slate-300 font-bangla bg-slate-900/50 px-3 py-2 rounded-lg border border-slate-700">
                <i class="fa-solid fa-hand-pointer text-amber-400 mr-1"></i> কার্ডের উপর বা বাটনে ক্লিক করে তথ্য দেখুন
            </div>
        </div>
    </header>

    <!-- Cards Grid Container -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6 lg:gap-8" id="cards-container">
        <!-- Javascript will inject 25 dynamic 3D interactive cards here -->
    </main>

    <!-- Footer -->
    <footer class="max-w-6xl mx-auto text-center mt-16 pb-8 border-t border-slate-800 pt-6">
        <p class="font-bangla text-slate-400 text-sm">
            স্পোকেন ইংলিশ শিখুন সহজে ও সুন্দর ইন্টারঅ্যাকটিভ কার্ডের মাধ্যমে।
        </p>
    </footer>

    <!-- Audio Speech Controller & App Logic Script -->
    <script>
        // Data items array (25 Conversations)
        const conversationData = [
            { id: 1, bn: "আরে! কেমন আছিস?", en: "Hey! How are you doing?", pronunciation: "হেই! হাউ আর ইউ ডুইং?", exp: "বন্ধুর সঙ্গে দেখা হলে এটি খুব স্বাভাবিক অভিবাদন। এখানে How are you doing? অর্থ How are you?—এরই কথ্য ও বন্ধুত্বপূর্ণ রূপ।" },
            { id: 2, bn: "অনেক দিন পর দেখা হলো!", en: "It's been a long time!", pronunciation: "ইটস বিন আ লং টাইম!", exp: "দীর্ঘদিন পর কারও সঙ্গে দেখা হলে বলা হয়। It's been হলো It has been-এর সংক্ষিপ্ত রূপ।" },
            { id: 3, bn: "তুই কোথায় ছিলি এত দিন?", en: "Where have you been all this time?", pronunciation: "হোয়্যার হ্যাভ ইউ বিন অল দিস টাইম?", exp: "দীর্ঘদিন কাউকে দেখা না গেলে তার অবস্থান বা অনুপস্থিতি সম্পর্কে জানতে ব্যবহার করা হয়।" },
            { id: 4, bn: "তোকে দেখে খুব ভালো লাগছে।", en: "It's so good to see you.", pronunciation: "ইটস সো গুড টু সি ইউ।", exp: "কারও সঙ্গে দেখা হওয়ার আনন্দ প্রকাশ করতে ব্যবহৃত হয়। Good to see you একটি প্রচলিত Natural Expression।" },
            { id: 5, bn: "কী খবর বল?", en: "What's up?", pronunciation: "হোয়াটস আপ?", exp: "বন্ধুদের মধ্যে বহুল ব্যবহৃত Casual Greeting। এখানে What's up? দিয়ে সাধারণত নতুন কী ঘটছে বা কেমন চলছে জানতে চাওয়া হয়।" },
            { id: 6, bn: "তেমন কিছু না, তোর কী খবর?", en: "Not much. What's up with you?", pronunciation: "নট মাচ। হোয়াটস আপ উইথ ইউ?", exp: "কেউ What's up? বললে স্বাভাবিক উত্তর হিসেবে Not much বলা যায়।" },
            { id: 7, bn: "আজকাল কী নিয়ে ব্যস্ত আছিস?", en: "What have you been up to lately?", pronunciation: "হোয়াট হ্যাভ ইউ বিন আপ টু লেইটলি?", exp: "সাম্প্রতিক সময়ে কেউ কী করছে বা কী নিয়ে ব্যস্ত আছে, তা জানতে এই Expression ব্যবহার করা হয়।" },
            { id: 8, bn: "চল, কোথাও ঘুরে আসি।", en: "Let's go somewhere.", pronunciation: "লেটস গো সামহোয়্যার।", exp: "কাউকে কোথাও যাওয়ার প্রস্তাব দিতে Let's + Verb ব্যবহার করা হয়। Let's অর্থ Let us।" },
            { id: 9, bn: "আজ তোর সঙ্গে একটু সময় কাটাতে চাই।", en: "I want to spend some time with you today.", pronunciation: "আই ওয়ান্ট টু স্পেন্ড সাম টাইম উইথ ইউ টুডে।", exp: "কারও সঙ্গে সময় কাটানোর ইচ্ছা প্রকাশ করতে spend time with someone ব্যবহার করা হয়।" },
            { id: 10, bn: "তুই কি আজ ফ্রি আছিস?", en: "Are you free today?", pronunciation: "আর ইউ ফ্রি টুডে?", exp: "কারও সময় আছে কি না জানতে এটি খুব প্রচলিত প্রশ্ন।" },
            { id: 11, bn: "আজ সন্ধ্যায় কী করবি?", en: "What are you doing this evening?", pronunciation: "হোয়াট আর ইউ ডুইং দিস ইভনিং?", exp: "ভবিষ্যতের নির্ধারিত পরিকল্পনা বা সম্ভাব্য কাজ জানতে Present Continuous ব্যবহার করা হয়েছে।" },
            { id: 12, bn: "আমার সঙ্গে যাবি?", en: "Do you wanna come with me?", pronunciation: "ডু ইউ ওয়ানা কাম উইথ মি?", exp: "Do you want to কথ্য আমেরিকান ইংরেজিতে প্রায়ই Do you wanna শোনা যায়। এটি অনানুষ্ঠানিক কথোপকথনে প্রচলিত।" },
            { id: 13, bn: "দাঁড়া, আমিও আসছি।", en: "Wait up! I'm coming too.", pronunciation: "ওয়েইট আপ! আইম কামিং টু।", exp: "Wait up অর্থ একটু অপেক্ষা করো। I'm coming too অর্থ আমিও আসছি।" },
            { id: 14, bn: "আরে, আমাকে ছাড়াই চলে গেলি?", en: "Hey, you left without me!", pronunciation: "হেই, ইউ লেফট উইদাউট মি?", exp: "বান্ধবপূর্ণ অভিযোগ বা অবাক হয়ে প্রশ্ন করতে ব্যবহার করা যায়। Without me অর্থ আমাকে ছাড়া।" },
            { id: 15, bn: "তুই একদম বদলে গেছিস!", en: "You've changed so much!", pronunciation: "ইউভ চেইঞ্জড সো মাচ!", exp: "You've হলো You have-এর সংক্ষিপ্ত রূপ। কারও মধ্যে আগের তুলনায় অনেক পরিবর্তন দেখলে বলা হয়।" },
            { id: 16, bn: "তুই এখনো আগের মতোই আছিস।", en: "You're still the same.", pronunciation: "ইউর স্টিল দ্য সেইম।", exp: "Still অর্থ এখনো এবং the same অর্থ একই রকম। কারও মধ্যে তেমন পরিবর্তন হয়নি বোঝাতে ব্যবহৃত হয়।" },
            { id: 17, bn: "তোর সঙ্গে কথা বলে ভালো লাগল।", en: "It was nice talking to you.", pronunciation: "ইট ওয়াজ নাইস টকিং টু ইউ।", exp: "কথোপকথন শেষে ভালো লাগা প্রকাশ করতে ব্যবহৃত হয়। এখানে talking একটি Gerund।" },
            { id: 18, bn: "আচ্ছা, পরে কথা হবে।", en: "Alright, I'll talk to you later.", pronunciation: "অলরাইট, আইল টক টু ইউ লেইটার।", exp: "কথোপকথন শেষ করার সময় বলা হয়। I'll হলো I will-এর সংক্ষিপ্ত রূপ।" },
            { id: 19, bn: "তুই কি আমাকে ভুলে গেছিস?", en: "Have you forgotten me?", pronunciation: "হ্যাভ ইউ ফরগটন মি?", exp: "কেউ দীর্ঘদিন যোগাযোগ না করলে মজা করে বা অভিমান করে এই প্রশ্ন করা যায়।" },
            { id: 20, bn: "তোকে একটা কথা বলার ছিল।", en: "I wanted to tell you something.", pronunciation: "আই ওয়ান্টিড টু টেল ইউ সামথিং।", exp: "কারও সঙ্গে কোনো বিষয় আলোচনা করতে চাইলে বলা হয়। এখানে wanted ব্যবহার করলেও কথাটি বর্তমানের ইচ্ছা বা প্রসঙ্গ বোঝাতে পারে।" },
            { id: 21, bn: "কী হয়েছে তোর?", en: "What's wrong with you?", pronunciation: "হোয়াটস রং উইথ ইউ?", exp: "কেউ মন খারাপ করে থাকলে বা অস্বাভাবিক আচরণ করলে কারণ জানতে ব্যবহার করা হয়। তবে পরিস্থিতিভেদে এটি বিরক্তিও প্রকাশ করতে পারে।" },
            { id: 22, bn: "আরে, এত চিন্তা করিস না।", en: "Come on, don't worry so much.", pronunciation: "কাম অন, ডোন্ট ওয়ারি সো মাচ।", exp: "কাউকে আশ্বস্ত করতে বলা হয়। Come on এখানে উৎসাহ বা সান্ত্বনা প্রকাশ করছে।" },
            { id: 23, bn: "ব্যাপারটা নিয়ে এত সিরিয়াস হোস না।", en: "Don't take it so seriously.", pronunciation: "ডোন্ট টেইক ইট সো সিরিয়াসলি।", exp: "কাউকে কোনো বিষয় অতিরিক্ত গুরুত্ব না দিতে বোঝাতে এই Expression ব্যবহার করা হয়।" },
            { id: 24, bn: "তুই তো সব সময় এমনই করিস!", en: "You always do this!", pronunciation: "ইউ অলওয়েজ ডু দিস!", exp: "কারও বারবার একই আচরণ করার বিষয়ে অভিযোগ বা বিরক্তি প্রকাশ করতে ব্যবহৃত হয়।" },
            { id: 25, bn: "ঠিক আছে, দেখা হলে সব বলব।", en: "Alright, I'll tell you everything when we meet.", pronunciation: "অলরাইট, আইল টেল ইউ এভরিথিং হোয়েন উই মিট।", exp: "ভবিষ্যতে দেখা হলে বিস্তারিত কিছু বলার প্রতিশ্রুতি দিতে I'll tell you ব্যবহার করা হয়েছে।" }
        ];

        // Track current state for each card (State 1: Bengali, State 2: English+Pron, State 3: Explanation)
        const cardStates = {};

        // Speech Synthesis API Setup
        const synth = window.speechSynthesis;
        let voices = [];

        function loadVoices() {
            voices = synth.getVoices();
        }
        
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        // Render Cards dynamically
        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            conversationData.forEach((item) => {
                cardStates[item.id] = cardStates[item.id] || 1; // Default to state 1
                const padId = String(item.id).padStart(2, '0');

                const cardHTML = `
                    <div id="card-${item.id}" class="card-3d rounded-2xl p-5 sm:p-6 flex flex-col justify-between relative overflow-hidden select-none cursor-pointer" onclick="handleCardClick(event, ${item.id})">
                        
                        <!-- Top Bar inside Card -->
                        <div class="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
                            <span class="badge-step bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-extrabold px-3 py-1 rounded-full text-xs sm:text-sm font-english tracking-wider">
                                #${padId}
                            </span>
                            <div class="flex items-center space-x-2 text-xs font-bangla text-sky-300 bg-sky-900/40 px-3 py-1 rounded-full border border-sky-500/30">
                                <span id="badge-state-text-${item.id}">ধাপ ১: বাংলা</span>
                            </div>
                        </div>

                        <!-- Main Content Body -->
                        <div class="space-y-4 my-2">
                            <!-- Always Visible: Bengali Sentence -->
                            <div class="bg-amber-400/10 p-3 sm:p-4 rounded-xl border border-amber-400/20 shadow-inner">
                                <p class="text-xs text-amber-300/80 font-bangla mb-1"><i class="fa-solid fa-language mr-1"></i>বাংলা বাক্য:</p>
                                <h3 class="font-bangla text-xl sm:text-2xl font-bold text-amber-200 leading-relaxed">
                                    ${item.bn}
                                </h3>
                            </div>

                            <!-- State 2 Content: English & Pronunciation -->
                            <div id="english-box-${item.id}" class="reveal-box space-y-3">
                                <div class="bg-indigo-950/60 p-3 sm:p-4 rounded-xl border border-indigo-500/30">
                                    <p class="text-xs text-indigo-300/80 font-english mb-1"><i class="fa-solid fa-font mr-1"></i>English Sentence:</p>
                                    <p class="font-english text-xl sm:text-2xl font-semibold text-cyan-200 leading-normal tracking-wide">
                                        ${item.en}
                                    </p>
                                </div>
                                <div class="bg-teal-950/50 p-3 rounded-xl border border-teal-500/20">
                                    <p class="text-xs text-teal-300/80 font-bangla mb-1"><i class="fa-solid fa-volume-low mr-1"></i>উচ্চারণ (Pronunciation):</p>
                                    <p class="font-bangla text-lg text-teal-200">
                                        ${item.pronunciation}
                                    </p>
                                </div>
                            </div>

                            <!-- State 3 Content: Explanation -->
                            <div id="explanation-box-${item.id}" class="reveal-box">
                                <div class="bg-purple-950/50 p-3 sm:p-4 rounded-xl border border-purple-500/30 text-purple-200">
                                    <p class="text-xs text-purple-300/80 font-bangla mb-1"><i class="fa-solid fa-circle-info mr-1"></i>ব্যাখ্যা (Explanation):</p>
                                    <p class="font-bangla text-sm sm:text-base leading-relaxed text-purple-100">
                                        ${item.exp}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- 3D Tactile Action Buttons Container -->
                        <div class="pt-4 mt-2 border-t border-white/10 flex flex-wrap items-center justify-between gap-2" onclick="event.stopPropagation()">
                            
                            <!-- Audio Pronunciation Buttons -->
                            <div class="flex items-center gap-2">
                                <button onclick="speakText('${escapeQuotes(item.en)}', 'en-GB')" class="btn-3d btn-uk text-xs px-3 py-2" title="Listen in British Accent">
                                    <span class="mr-1.5 text-base">🇬🇧</span> UK Voice
                                </button>
                                <button onclick="speakText('${escapeQuotes(item.en)}', 'en-US')" class="btn-3d btn-us text-xs px-3 py-2" title="Listen in American Accent">
                                    <span class="mr-1.5 text-base">🇺🇸</span> US Voice
                                </button>
                            </div>

                            <!-- Step Toggle Button -->
                            <button onclick="advanceCardState(${item.id})" class="btn-3d btn-step text-xs px-3.5 py-2 font-bangla ml-auto">
                                <span id="btn-label-${item.id}">পরবর্তী ধাপ <i class="fa-solid fa-chevron-right ml-1"></i></span>
                            </button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
                updateCardUI(item.id);
            });
        }

        // Handle full card clicks
        function handleCardClick(event, id) {
            // Prevent state toggle if text was highlighted/selected by user
            const selection = window.getSelection();
            if (selection.toString().length > 0) return;
            
            advanceCardState(id);
        }

        // Advance specific card through 3 states sequentially
        function advanceCardState(id) {
            if (!cardStates[id]) cardStates[id] = 1;
            
            cardStates[id] = (cardStates[id] % 3) + 1; // Cycles: 1 -> 2 -> 3 -> 1
            updateCardUI(id);
        }

        // Update Card Visuals based on current state
        function updateCardUI(id) {
            const state = cardStates[id];
            const englishBox = document.getElementById(`english-box-${id}`);
            const explanationBox = document.getElementById(`explanation-box-${id}`);
            const badgeText = document.getElementById(`badge-state-text-${id}`);
            const btnLabel = document.getElementById(`btn-label-${id}`);

            if (!englishBox || !explanationBox) return;

            if (state === 1) {
                // State 1: Bengali Only
                englishBox.classList.remove('active');
                explanationBox.classList.remove('active');
                badgeText.innerText = 'ধাপ ১: বাংলা';
                btnLabel.innerHTML = 'ইংরেজি ও উচ্চারণ <i class="fa-solid fa-chevron-right ml-1"></i>';
            } else if (state === 2) {
                // State 2: English & Pronunciation Revealed
                englishBox.classList.add('active');
                explanationBox.classList.remove('active');
                badgeText.innerText = 'ধাপ ২: ইংরেজি ও উচ্চারণ';
                btnLabel.innerHTML = 'ব্যাখ্যা দেখুন <i class="fa-solid fa-chevron-right ml-1"></i>';
            } else if (state === 3) {
                // State 3: Full Explanation Revealed
                englishBox.classList.add('active');
                explanationBox.classList.add('active');
                badgeText.innerText = 'ধাপ ৩: সম্পূর্ণ বিস্তারিত';
                btnLabel.innerHTML = 'পুনরায় শুরুতে <i class="fa-solid fa-rotate-left ml-1"></i>';
            }
        }

        // Global Action: Expand All Cards to State 3
        function expandAllCards() {
            conversationData.forEach(item => {
                cardStates[item.id] = 3;
                updateCardUI(item.id);
            });
        }

        // Global Action: Reset All Cards to State 1
        function resetAllCards() {
            conversationData.forEach(item => {
                cardStates[item.id] = 1;
                updateCardUI(item.id);
            });
        }

        // Speech Synthesis Function
        function speakText(text, langCode) {
            if (!('speechSynthesis' in window)) {
                alert('আপনার ব্রাউজারে টেক্সট-টু-স্পিচ (Audio Pronunciation) সাপোর্ট করছে না।');
                return;
            }

            // Stop any ongoing speech
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            utterance.rate = 0.88; // Slightly slower speech rate for clear pronunciation

            // Select matching voice accent if available
            const matchingVoices = synth.getVoices().filter(voice => voice.lang.includes(langCode) || voice.lang.replace('_', '-').includes(langCode));
            if (matchingVoices.length > 0) {
                utterance.voice = matchingVoices[0];
            }

            synth.speak(utterance);
        }

        // Helper function to escape single quotes in JS inline onclick attributes
        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            renderCards();
            loadVoices();
        });
    </script>
</body>
</html>
