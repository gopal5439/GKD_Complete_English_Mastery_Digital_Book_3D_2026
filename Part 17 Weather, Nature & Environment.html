    <script>
        const data = [
            { id: 401, bn: "আজ আবহাওয়া খুব সুন্দর।", en: "The weather is very beautiful today.", pr: "দ্য ওয়েদার ইজ ভেরি বিউটিফুল টুডে।", exp: "দিনের আবহাওয়া ভালো বা মনোরম বোঝাতে বাক্যটি ব্যবহার করা হয়। Weather অর্থ আবহাওয়া।" },
            { id: 402, bn: "আজ খুব গরম পড়েছে।", en: "It is very hot today.", pr: "ইট ইজ ভেরি হট টুডে।", exp: "দিনের তাপমাত্রা বেশি হলে বাক্যটি বলা হয়। আবহাওয়া বোঝাতে ইংরেজিতে প্রায়ই It is দিয়ে বাক্য শুরু হয়।" },
            { id: 403, bn: "আজ খুব ঠান্ডা লাগছে।", en: "It feels very cold today.", pr: "ইট ফিলস ভেরি কোল্ড টুডে।", exp: "আজকের আবহাওয়ায় ঠান্ডা অনুভূত হচ্ছে বোঝাতে বাক্যটি ব্যবহার করা হয়। Feels cold অর্থ ঠান্ডা অনুভূত হওয়া।" },
            { id: 404, bn: "বাইরে বৃষ্টি হচ্ছে।", en: "It is raining outside.", pr: "ইট ইজ রেইনিং আউটসাইড।", exp: "বর্তমানে বাইরে বৃষ্টি হচ্ছে বোঝাতে Present Continuous Tense ব্যবহার করা হয়েছে। Raining অর্থ বৃষ্টি হওয়া।" },
            { id: 405, bn: "আজ আকাশ মেঘে ঢাকা।", en: "The sky is cloudy today.", pr: "দ্য স্কাই ইজ ক্লাউডি টুডে।", exp: "আকাশে অনেক মেঘ থাকলে বাক্যটি ব্যবহার করা হয়। Cloudy অর্থ মেঘলা।" },
            { id: 406, bn: "আজ আকাশ পরিষ্কার।", en: "The sky is clear today.", pr: "দ্য স্কাই ইজ ক্লিয়ার টুডে।", exp: "আকাশে মেঘ কম বা একেবারেই নেই বোঝাতে বাক্যটি বলা হয়। Clear অর্থ পরিষ্কার বা নির্মল।" },
            { id: 407, bn: "বাইরে খুব বাতাস বইছে।", en: "It is very windy outside.", pr: "ইট ইজ ভেরি উইন্ডি আউটসাইড।", exp: "বাইরে বাতাসের প্রবাহ বেশি হলে বাক্যটি ব্যবহার করা হয়। Windy অর্থ বাতাসপূর্ণ বা ঝোড়ো বাতাসযুক্ত।" },
            { id: 408, bn: "আজ কি বৃষ্টি হবে?", en: "Will it rain today?", pr: "উইল ইট রেইন টুডে?", exp: "আজ বৃষ্টি হওয়ার সম্ভাবনা আছে কি না জানতে প্রশ্নটি করা হয়। Will দিয়ে ভবিষ্যতের ঘটনা সম্পর্কে প্রশ্ন করা হয়েছে।" },
            { id: 409, bn: "গত রাতে প্রচুর বৃষ্টি হয়েছিল।", en: "It rained heavily last night.", pr: "ইট রেইন্ড হেভিলি লাস্ট নাইট।", exp: "অতীতের কোনো সময়ে প্রচুর বৃষ্টি হওয়ার কথা বোঝাতে বাক্যটি ব্যবহার করা হয়। Rained হলো rain-এর past form।" },
            { id: 410, bn: "বৃষ্টির পর প্রকৃতি আরও সুন্দর হয়ে ওঠে।", en: "Nature becomes more beautiful after the rain.", pr: "নেচার বিকামস মোর বিউটিফুল আফটার দ্য রেইন।", exp: "বৃষ্টির পরে প্রকৃতির সৌন্দর্য বেড়ে যাওয়ার কথা বোঝাতে বাক্যটি বলা হয়। Becomes অর্থ হয়ে ওঠে।" },
            { id: 411, bn: "সূর্য পূর্ব দিকে ওঠে।", en: "The sun rises in the east.", pr: "দ্য সান রাইজিজ ইন দি ইস্ট।", exp: "সূর্যোদয়ের চিরন্তন সত্য বোঝাতে বাক্যটি ব্যবহার করা হয়। সাধারণ সত্য প্রকাশের জন্য Present Simple Tense ব্যবহৃত হয়েছে।" },
            { id: 412, bn: "সন্ধ্যায় সূর্য পশ্চিম দিকে অস্ত যায়।", en: "The sun sets in the west in the evening.", pr: "দ্য সান সেটস ইন দ্য ওয়েস্ট ইন দি ইভনিং।", exp: "সূর্যাস্তের সাধারণ নিয়ম বোঝাতে বাক্যটি বলা হয়। Sets হলো set-এর তৃতীয় পুরুষ একবচনের বর্তমান রূপ।" },
            { id: 413, bn: "গাছ আমাদের অক্সিজেন দেয়।", en: "Trees give us oxygen.", pr: "ট্রিজ গিভ আস অক্সিজেন।", exp: "গাছ পরিবেশে অক্সিজেন সরবরাহ করে—এটি বোঝাতে বাক্যটি ব্যবহার করা হয়। Give অর্থ দেওয়া এবং oxygen অর্থ অক্সিজেন।" },
            { id: 414, bn: "আমাদের বেশি বেশি গাছ লাগানো উচিত।", en: "We should plant more trees.", pr: "উই শুড প্ল্যান্ট মোর ট্রিজ।", exp: "পরিবেশের ভারসাম্য রক্ষার জন্য গাছ লাগানোর পরামর্শ দিতে বাক্যটি বলা হয়। Should দিয়ে পরামর্শ প্রকাশ করা হয়েছে।" },
            { id: 415, bn: "নদীর পানি ধীরে ধীরে বাড়ছে।", en: "The river water is rising slowly.", pr: "দ্য রিভার ওয়াটার ইজ রাইজিং স্লোলি।", exp: "নদীর পানির উচ্চতা বর্তমানে বৃদ্ধি পাচ্ছে বোঝাতে বাক্যটি ব্যবহার করা হয়। Is rising চলমান পরিবর্তন প্রকাশ করে।" },
            { id: 416, bn: "এই নদীটি খুব গভীর।", en: "This river is very deep.", pr: "দিস রিভার ইজ ভেরি ডিপ।", exp: "নদীর গভীরতা সম্পর্কে জানাতে বাক্যটি বলা হয়। Deep অর্থ গভীর।" },
            { id: 417, bn: "আমাদের পরিবেশ পরিষ্কার রাখা উচিত।", en: "We should keep our environment clean.", pr: "উই শুড কিপ আওয়ার এনভায়রনমেন্ট ক্লিন।", exp: "পরিবেশ পরিচ্ছন্ন রাখার প্রয়োজনীয়তা বোঝাতে বাক্যটি ব্যবহার করা হয়। Keep something clean অর্থ কোনো কিছু পরিষ্কার রাখা।" },
            { id: 418, bn: "বায়ুদূষণ আমাদের স্বাস্থ্যের জন্য ক্ষতিকর।", en: "Air pollution is harmful to our health.", pr: "এয়ার পলিউশন ইজ হার্মফুল টু আওয়ার হেলথ।", exp: "দূষিত বাতাস মানুষের স্বাস্থ্যের ক্ষতি করে বোঝাতে বাক্যটি বলা হয়। Harmful to অর্থ কোনো কিছুর জন্য ক্ষতিকর।" },
            { id: 419, bn: "প্লাস্টিক পরিবেশের জন্য ক্ষতিকর।", en: "Plastic is harmful to the environment.", pr: "প্লাস্টিক ইজ হার্মফুল টু দি এনভায়রনমেন্ট।", exp: "প্লাস্টিকের কারণে পরিবেশের ক্ষতি হয় বোঝাতে বাক্যটি ব্যবহার করা হয়। Environment অর্থ পরিবেশ।" },
            { id: 420, bn: "আমাদের পানি অপচয় করা উচিত নয়।", en: "We should not waste water.", pr: "উই শুড নট ওয়েস্ট ওয়াটার।", exp: "পানির সঠিক ব্যবহার নিশ্চিত করার পরামর্শ দিতে বাক্যটি বলা হয়। Waste অর্থ অপচয় করা।" },
            { id: 421, bn: "শীতকালে কুয়াশা বেশি পড়ে।", en: "There is a lot of fog in winter.", pr: "দেয়ার ইজ আ লট অভ ফগ ইন উইন্টার।", exp: "শীতকালে কুয়াশার আধিক্য বোঝাতে বাক্যটি ব্যবহার করা হয়। A lot of fog অর্থ প্রচুর কুয়াশা।" },
            { id: 422, bn: "বসন্তকালে গাছে নতুন পাতা গজায়।", en: "New leaves grow on trees in spring.", pr: "নিউ লিভস গ্রো অন ট্রিজ ইন স্প্রিং।", exp: "বসন্তকালে গাছে নতুন পাতা জন্মানোর স্বাভাবিক ঘটনা বোঝাতে বাক্যটি বলা হয়। Leaves হলো leaf-এর plural form।" },
            { id: 423, bn: "পাখিরা আকাশে উড়ছে।", en: "Birds are flying in the sky.", pr: "বার্ডস আর ফ্লাইং ইন দ্য স্কাই।", exp: "পাখিরা বর্তমানে উড়ছে বোঝাতে Present Continuous Tense ব্যবহার করা হয়েছে। Flying হলো fly-এর ing form।" },
            { id: 424, bn: "প্রকৃতির সৌন্দর্য আমাকে মুগ্ধ করে।", en: "The beauty of nature fascinates me.", pr: "দ্য বিউটি অভ নেচার ফ্যাসিনেটস মি।", exp: "প্রকৃতির সৌন্দর্য দেখে মুগ্ধ হওয়ার অনুভূতি প্রকাশ করতে বাক্যটি ব্যবহার করা হয়। Fascinates অর্থ মুগ্ধ করে।" },
            { id: 425, bn: "পৃথিবীকে রক্ষা করা আমাদের সবার দায়িত্ব।", en: "Protecting the Earth is everyone's responsibility.", pr: "প্রোটেক্টিং দি আর্থ ইজ এভরিওয়ানস রেসপনসিবিলিটি।", exp: "পৃথিবী ও পরিবেশ রক্ষার দায়িত্ব সবার—এ কথা বোঝাতে বাক্যটি বলা হয়। এখানে Protecting the Earth একটি gerund phrase, যা বাক্যের subject হিসেবে ব্যবহৃত হয়েছে।" }
        ];

        const container = document.getElementById('cardsContainer');

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.step = "0";

            card.innerHTML = `
                <div class="step-indicator">ক্লিক করুন (১/৩)</div>
                <div class="card-header">
                    <span class="badge">${item.id}</span>
                    <div class="bangla-text">${item.bn}</div>
                </div>
                <div class="english-section">
                    <div class="english-text">${item.en}</div>
                    <div class="pronunciation">উচ্চারণ: ${item.pr}</div>
                    <div class="audio-buttons">
                        <button class="btn-3d" onclick="speakText(event, '${escapeQuotes(item.en)}', 'en-US')">🔊 US Voice</button>
                        <button class="btn-3d btn-uk" onclick="speakText(event, '${escapeQuotes(item.en)}', 'en-GB')">🔊 UK Voice</button>
                    </div>
                </div>
                <div class="explanation-section">
                    <div class="explanation-text"><strong>ব্যাখ্যা:</strong> ${item.exp}</div>
                </div>
            `;

            card.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') return;

                let currentStep = parseInt(card.dataset.step);
                currentStep = (currentStep + 1) % 3;
                card.dataset.step = currentStep;

                const englishSec = card.querySelector('.english-section');
                const expSec = card.querySelector('.explanation-section');
                const indicator = card.querySelector('.step-indicator');

                if (currentStep === 0) {
                    englishSec.style.display = 'none';
                    expSec.style.display = 'none';
                    indicator.textContent = 'ক্লিক করুন (১/৩)';
                } else if (currentStep === 1) {
                    englishSec.style.display = 'block';
                    expSec.style.display = 'none';
                    indicator.textContent = 'আবার ক্লিক করুন (২/৩)';
                } else if (currentStep === 2) {
                    englishSec.style.display = 'block';
                    expSec.style.display = 'block';
                    indicator.textContent = 'রিসেট করতে ক্লিক করুন (৩/৩)';
                }
            });

            container.appendChild(card);
        });

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        function speakText(event, text, lang) {
            event.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('আপনার ব্রাউজার টেক্সট-টু-স্পিচ ভয়েস সাপোর্ট করে না।');
            }
        }
    </script>
</body>
</html>
