    <script>
        /* ==========================================================
           COMPLETE DETAILED DATA REPOSITORY (Global Standard)
           - NO DATA HAS BEEN MODIFIED HERE -
           ========================================================== */
        const topicAnalysisData = {
            "topic_1": {
                title: "১. Verb কী? (সংসারের বৌ বা ঘরের ইঞ্জিন রূপক অর্থে)",
                html: `
                    <div class="content-cat-box">
                        <h4>🏠 বাস্তব জীবনের রূপক ও সংজ্ঞা</h4>
                        <p>পরিবারে যেমন একজন গৃহকর্ত্রী বা বৌ ছাড়া পুরো ঘর অচল, নির্জীব ও এলোমেলো হয়ে থাকে, ঠিক তেমনি ইংরেজি ব্যাকরণে <strong>Verb (ক্রিয়া)</strong> হলো বাক্যের আসল প্রাণশক্তি বা মেইন ইঞ্জিন। সাবজেক্ট বা অবজেক্ট যতই শক্তিশালী হোক না কেন, Verb না থাকলে বাক্য কোনো অর্থ প্রকাশ করতে পারে না。</p>
                        <div class="example-box">
                            • <strong>Action Verb (কার্যবাচক):</strong> He <span class="eng-text">writes</span> a letter. (সে চিঠি লেখে)<br>
                            • <strong>State Verb (অবস্থাবাচক):</strong> She <span class="eng-text">appears</span> sad. (তাকে দুঃখী মনে হচ্ছে)<br>
                            • <strong>Possession (অধিকারসূচক):</strong> They <span class="eng-text">have</span> a big house. (তাদের একটি বড় বাড়ি আছে)
                        </div>
                    </div>
                    <div class="content-cat-box">
                        <h4>🔍 খুঁটিনাটি চেনার উপায় ও গুরুত্ব</h4>
                        <p style="font-family: 'Hind Siliguri', 'Tiro Bangla', sans-serif; line-height: 1.8; color: #334155; background-color: #f8fafc; padding: 24px; border-left: 6px solid #0ea5e9; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin: 20px 0;">
    <span style="font-size: 1.4rem; color: #0284c7; font-weight: bold;">Verb চেনার মূলমন্ত্র: সময় ও কাজের গতিপ্রকৃতি নির্ণয় করা</span><br><br>

    বাক্যের সময় (Tense) এবং কাজের গতিপ্রকৃতি কেবল <strong>Verb</strong>-এর রূপ বদলানোর মাধ্যমেই প্রকাশ পায়। অর্থাৎ, বাক্যে ব্যবহৃত যে শব্দটি Tense বা সময়ের পরিবর্তনের সাথে সাথে নিজের রূপ বদলাতে পারে, সেটিই মূলত <strong>Verb</strong>।<br><br>

    একটি বাক্যে অনেক ধরনের শব্দ থাকতে পারে, কিন্তু সময়ের পরিবর্তনের সাথে নিজের চেহারা বদলানোর ক্ষমতা কেবল Verb-এরই আছে। অন্য কোনো শব্দ (যেমন: Noun, Pronoun বা Adjective) সময়ের সাথে বদলায় না।<br><br>

    <span style="font-size: 1.15rem; color: #0369a1; font-weight: bold;">১. সময়ের (Tense) সাথে রূপ বদলানোর ম্যাজিক:</span><br>
    নিচের বাক্যগুলো লক্ষ্য করুন—<br>
    ▪ <strong>বর্তমান (প্রতিদিন হয়):</strong> He <span style="color: #ea580c; font-weight: bold;">goes</span> to school.<br>
    ▪ <strong>অতীত (গতকাল হয়েছিল):</strong> He <span style="color: #ea580c; font-weight: bold;">went</span> to school.<br>
    ▪ <strong>ভবিষ্যৎ (আগামীকাল হবে):</strong> He <span style="color: #ea580c; font-weight: bold;">will go</span> to school.<br><br>

    <span style="background-color: #e0f2fe; color: #075985; padding: 4px 10px; border-radius: 4px; font-weight: bold;">📌 পর্যবেক্ষণ:</span> উপরের তিনটি বাক্যে 'He', 'to' এবং 'school'—এই শব্দগুলোর কোনো পরিবর্তন হয়নি। সময়ের সাথে তাল মিলিয়ে কেবল 'Go' শব্দটিই বদলে গিয়ে যথাক্রমে <strong style="color: #ea580c;">goes</strong>, <strong style="color: #ea580c;">went</strong> এবং <strong style="color: #ea580c;">will go</strong> হয়েছে। তাই এটিই Verb।<br><br>

    <span style="color: #64748b; font-size: 0.95rem;"><i>(বিপরীতে, 'He is a good boy' বাক্যটিকে অতীতের রূপ দিয়ে 'He was a good boy' করলে 'good' শব্দটির কোনো পরিবর্তন হয় fix, কারণ এটি Verb নয়। এখানে 'is' পরিবর্তন হয়ে 'was' হয়েছে, তাই 'is/was' হলো Verb।)</i></span><br><br>

    <span style="font-size: 1.15rem; color: #0369a1; font-weight: bold;">২. কাজের গতিপ্রকৃতি (Aspect) প্রকাশ:</span><br>

                html: `

                        <p style="font-family: 'Hind Siliguri', 'Tiro Bangla', sans-serif; line-height: 1.8; color: #334155; background-color: #f8fafc; padding: 24px; border-left: 6px solid #4f46e5; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin: 20px 0;">
    <span style="font-size: 1.4rem; color: #4338ca; font-weight: bold;">📍 বাক্যে Verb-এর অবস্থান: Verb ঠিক কোথায় বসে?</span><br><br>

    বাক্যে Verb-এর অবস্থান মূলত বাক্যের ধরন (Sentence Type) এবং বাক্যের অর্থের ওপর নির্ভর করে। একটি বাক্যে Verb কোথায় বসবে, তা নির্ধারণ করার জন্য বাক্যের প্রকারভেদ অনুযায়ী নিচের নিয়মগুলো মনে রাখা জরুরি:<br><br>

    <span style="font-size: 1.15rem; color: #1d4ed8; font-weight: bold;">১. Assertive Sentence (বর্ণনামূলক বাক্য):</span><br>
    সাধারণ বর্ণনামূলক বাক্যে Verb সবসময় <strong>Subject-এর ঠিক পরে</strong> বসে।<br>
    ▪ <span style="color: #64748b;">শুধু মূল Verb থাকলে:</span> Subject + Main Verb<br>
    &nbsp;&nbsp; <i>উদাহরণ:</i> The students <strong style="color: #ea580c;">read</strong> English books daily.<br>
    ▪ <span style="color: #64748b;">Auxiliary Verb থাকলে:</span> Subject + Auxiliary Verb + Main Verb<br>
    &nbsp;&nbsp; <i>উদাহরণ:</i> The students <strong style="color: #ea580c;">are reading</strong> English books.<br>
    ▪ <span style="color: #64748b;">Negative বাক্যের ক্ষেত্রে:</span> Subject + Auxiliary Verb + not + Main Verb<br>
    &nbsp;&nbsp; <i>উদাহরণ:</i> He <strong style="color: #ea580c;">does not like</strong> coffee.<br><br>

    <span style="font-size: 1.15rem; color: #1d4ed8; font-weight: bold;">২. Interrogative Sentence (প্রশ্নবোধক বাক্য):</span><br>
    প্রশ্ন করার জন্য সাহায্যকারী Verb-কে <strong>Subject-এর সামনে</strong> নিয়ে আসতে হয়।<br>

    এই ধরনের বাক্যে Subject (You) উহ্য থাকে। তাই বাক্য সরাসরি <strong>Verb দিয়ে শুরু হয়</strong>।<br>

    &nbsp;&nbsp; <i>উদাহরণ:</i> <strong style="color: #d946ef;">Close</strong> the main door immediately.<br>
    ▪ <span style="color: #64748b;">নিষেধ (Negative):</span> Do not (Don't) / Never + Main Verb.<br>

    <span style="font-size: 1.15rem; color: #1d4ed8; font-weight: bold;">৪. Optative Sentence (প্রার্থনা বা ইচ্ছাসূচক বাক্য):</span><br>
    কারো জন্য দোয়া বা ইচ্ছা প্রকাশ করার ক্ষেত্রে বাক্যের শুরুতে 'May' বা 'Long' বসে এবং এরপর <strong>Subject-এর পরে</strong> মূল Verb বসে।<br>
    ▪ <i>উদাহরণ:</i> May Allah <strong style="color: #0284c7;">bless</strong> you.<br><br>

    <span style="font-size: 1.15rem; color: #1d4ed8; font-weight: bold;">৫. Exclamatory Sentence (আবেগ বা বিস্ময়সূচক বাক্য):</span><br>

        ✔ প্রশ্ন করলে (Interrogative): Subject-এর আগে সাহায্যকারী, পরে মূল Verb।<br>
        ✔ আদেশ/নিষেধ করলে (Imperative): বাক্যের একদম শুরুতে।<br>
        ✔ দোয়া করলে (Optative): May এবং Subject-এর পরে।<br>

    </span>
</p>

                html: `
