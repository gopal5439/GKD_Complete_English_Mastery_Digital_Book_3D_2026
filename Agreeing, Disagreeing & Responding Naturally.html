<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <title>TOPIC 06: Agreeing, Disagreeing & Responding Naturally</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-uk: #ec4899;
            --accent-us: #06b6d4;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --text-muted: #94a3b8;
            --font-bn: 'Tiro Bangla', serif;
            --font-en: 'Times New Roman', Times, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-bn);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: var(--font-en);
            font-size: 2.2rem;
            color: #818cf8;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        header h2 {
            font-family: var(--font-bn);
            font-size: 1.5rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            width: 100%;
            max-width: 1200px;
            perspective: 1000px;
        }

        /* 3D Glassmorphism Box Style */
        .card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 
                        0 8px 10px -6px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 35px -10px rgba(99, 102, 241, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .card-number {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            font-family: var(--font-en);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* Section 1: Bengali (Always Visible) */
        .sec-bn {
            font-family: var(--font-bn);
            font-size: 1.35rem;
            color: #ffffff;
            line-height: 1.5;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }

        /* Section 2: English & Pronunciation (Revealed on Step 1) */
        .sec-en {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .en-text {
            font-family: var(--font-en);
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .en-pron {
            font-family: var(--font-bn);
            font-size: 1.05rem;
            color: #f472b6;
        }

        /* Section 3: Explanation (Revealed on Step 2) */
        .sec-exp {
            display: none;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
            padding: 0.9rem;
            font-family: var(--font-bn);
            font-size: 0.98rem;
            color: var(--text-sub);
            line-height: 1.6;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            animation: fadeIn 0.4s ease-in-out forwards;
            margin-bottom: 1rem;
        }

        /* 3D Audio Buttons Container */
        .audio-controls {
            display: flex;
            gap: 0.8rem;
            margin-top: auto;
            padding-top: 0.5rem;
        }

        .btn-3d {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.6rem 0.8rem;
            border: none;
            border-radius: 10px;
            font-family: var(--font-en);
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        /* UK Button 3D Effect */
        .btn-uk {
            background: linear-gradient(to bottom, #f43f5e, #be123c);
            box-shadow: 0 4px 0 #881337, 0 5px 10px rgba(0,0,0,0.4);
        }

        .btn-uk:hover {
            background: linear-gradient(to bottom, #fb7185, #e11d48);
        }

        .btn-uk:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #881337, 0 2px 4px rgba(0,0,0,0.4);
        }

        /* US Button 3D Effect */
        .btn-us {
            background: linear-gradient(to bottom, #0284c7, #0369a1);
            box-shadow: 0 4px 0 #075985, 0 5px 10px rgba(0,0,0,0.4);
        }

        .btn-us:hover {
            background: linear-gradient(to bottom, #38bdf8, #0284c7);
        }

        .btn-us:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #075985, 0 2px 4px rgba(0,0,0,0.4);
        }

        .click-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 0.3rem;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 1rem 0.5rem; }
            header h1 { font-size: 1.6rem; }
            header h2 { font-size: 1.2rem; }
            .cards-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

                en: "I couldn't agree with that more.",
                pron: "উচ্চারণ: আই কুডন্ট অ্যাগ্রি উইথ দ্যাট মোর।",
                exp: "ব্যাখ্যা: কোনো বক্তব্যের সঙ্গে সম্পূর্ণ একমত হওয়া বোঝায়। I couldn't agree more এর মতোই এটি একটি জোরালো সম্মতির প্রকাশ।"
            },
            {
                bn: "২৩. হ্যাঁ, কিন্তু একটা বিষয় মনে রাখা দরকার।",
                en: "Yes, but there's one thing to keep in mind.",
                pron: "উচ্চারণ: ইয়েস, বাট দেয়ারস ওয়ান থিং টু কিপ ইন মাইন্ড।",
                exp: "ব্যাখ্যা: কারও বক্তব্য মেনে নিয়ে অতিরিক্ত গুরুত্বপূর্ণ বিষয় তুলে ধরতে ব্যবহার করা হয়। Keep in mind অর্থ মনে রাখা।"
            },
            {
                bn: "২৪. তোর যুক্তিটা আমি বুঝতে পারছি।",
                en: "I understand your point.",
                pron: "উচ্চারণ: আই আন্ডারস্ট্যান্ড ইয়োর পয়েন্ট।",
                exp: "ব্যাখ্যা: কারও বক্তব্যের মূল যুক্তি বা উদ্দেশ্য বুঝতে পারলে এই বাক্যটি ব্যবহার করা হয়।"
            },
            {
                bn: "২৫. ঠিক আছে, তোর কথাটা মেনে নিলাম।",
                en: "Alright, I'll take your word for it.",
                pron: "উচ্চারণ: অলরাইট, আইল টেইক ইয়োর ওয়ার্ড ফর ইট।",
                exp: "ব্যাখ্যা: কারও কথা বিশ্বাস করে আপাতত মেনে নেওয়া বোঝাতে take your word for it ব্যবহার করা হয়।"
            }
        ];

        const container = document.getElementById('cardsContainer');

        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.step = '0'; // 0: BN only, 1: BN+EN, 2: BN+EN+EXP

            card.innerHTML = `
                <span class="card-number">#${String(index + 1).padStart(2, '0')}</span>
                <div class="sec-bn">${item.bn}</div>
                
                <div class="sec-en">
                    <div class="en-text">${item.en}</div>
                    <div class="en-pron">${item.pron}</div>
                </div>

                <div class="sec-exp">${item.exp}</div>

                <div class="audio-controls" onclick="event.stopPropagation()">
                    <button class="btn-3d btn-uk" onclick="speakText('${escapeQuotes(item.en)}', 'en-GB')">
                        🇬🇧 UK Voice
                    </button>
                    <button class="btn-3d btn-us" onclick="speakText('${escapeQuotes(item.en)}', 'en-US')">
                        🇺🇸 US Voice
                    </button>
                </div>
                <div class="click-hint">ক্লিক করুন (ধাপ ১/৩)</div>
            `;

            // Card Click Event for 3-step reveal
            card.addEventListener('click', () => {
                let currentStep = parseInt(card.dataset.step);
                const secEn = card.querySelector('.sec-en');
                const secExp = card.querySelector('.sec-exp');
                const hint = card.querySelector('.click-hint');

                if (currentStep === 0) {
                    secEn.style.display = 'block';
                    card.dataset.step = '1';
                    hint.textContent = 'পুনরায় ক্লিক করুন (ধাপ ২/৩)';
                } else if (currentStep === 1) {
                    secExp.style.display = 'block';
                    card.dataset.step = '2';
                    hint.textContent = 'লুকাবারে ক্লিক করুন (ধাপ ৩/৩)';
                } else {
                    secEn.style.display = 'none';
                    secExp.style.display = 'none';
                    card.dataset.step = '0';
                    hint.textContent = 'ক্লিক করুন (ধাপ ১/৩)';
                }
            });

            container.appendChild(card);
        });

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        // Web Speech API Text-To-Speech Function
        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current playing audio
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9; // Slightly slower for clear instruction
                window.speechSynthesis.speak(utterance);
            } else {
                alert('আপনার ব্রাউজারে স্পিচ ফিচারটি সাপোর্ট করছে না।');
            }
        }
    </script>
</body>
</html>
