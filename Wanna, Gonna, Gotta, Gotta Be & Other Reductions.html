    <script>
        // Dataset of 25 Items provided by the user
        const dataset = [
            { id: 1, bangla: "আমি জানতাম না।", standard: "I did not know.", natural: "I didn't know.", pronunciation: "আই ডিডন্ট নো।", explanation: "Did not এর সংক্ষিপ্ত রূপ Didn't। অতীতের কোনো বিষয় না জানার কথা বোঝায়।" },
            { id: 2, bangla: "আমি তোমাকে বলিনি।", standard: "I did not tell you.", natural: "I didn't tell ya.", pronunciation: "আই ডিডন্ট টেল ইয়া।", explanation: "Didn't হলো Standard Contraction এবং you দ্রুত কথায় ya শোনাতে পারে।" },
            { id: 3, bangla: "সে এখানে নেই।", standard: "He is not here.", natural: "He isn't here.", pronunciation: "হি ইজন্ট হিয়ার।", explanation: "Is not এর সংক্ষিপ্ত রূপ Isn't।" },
            { id: 4, bangla: "আমি তোমার সঙ্গে একমত নই।", standard: "I am not agreeing with you.", natural: "I'm not agreeing with you.", pronunciation: "আইম নট অ্যাগ্রিইং উইথ ইউ।", explanation: "I am সংক্ষিপ্ত হয়ে I'm হয়েছে। তবে স্থায়ী মতামতের ক্ষেত্রে I don't agree with you বেশি স্বাভাবিক।" },
            { id: 5, bangla: "তারা এখনও আসেনি।", standard: "They have not arrived yet.", natural: "They haven't arrived yet.", pronunciation: "দেই হ্যাভন্ট অ্যারাইভড ইয়েট।", explanation: "Have not সংক্ষিপ্ত হয়ে Haven't হয়েছে। Present Perfect Tense ব্যবহৃত হয়েছে।" },
            { id: 6, bangla: "আমি কখনো সেখানে যাইনি।", standard: "I have never been there.", natural: "I've never been there.", pronunciation: "আইভ নেভার বিন দেয়ার।", explanation: "I have সংক্ষিপ্ত হয়ে I've হয়েছে। জীবনের অভিজ্ঞতা বোঝাতে Present Perfect ব্যবহৃত হয়েছে।" },
            { id: 7, bangla: "সে এটা করতে পারবে না।", standard: "She will not be able to do it.", natural: "She won't be able to do it.", pronunciation: "শি ওউন্ট বি এইবল টু ডু ইট।", explanation: "Will not এর সংক্ষিপ্ত রূপ Won't।" },
            { id: 8, bangla: "আমি এখন ব্যস্ত।", standard: "I am busy right now.", natural: "I'm busy right now.", pronunciation: "আইম বিজি রাইট নাউ।", explanation: "I am থেকে I'm হয়েছে। Right now অর্থ এই মুহূর্তে।" },
            { id: 9, bangla: "তুমি কি আমাকে সাহায্য করবে?", standard: "Will you help me?", natural: "Will ya help me?", pronunciation: "উইল ইয়া হেল্প মি?", explanation: "You অনানুষ্ঠানিক উচ্চারণে ya হতে পারে। এটি লিখিত Standard English নয়।" },
            { id: 10, bangla: "তুমি এটা করেছ, তাই না?", standard: "You have done it, haven't you?", natural: "You've done it, haven't you?", pronunciation: "ইউভ ডান ইট, হ্যাভন্ট ইউ?", explanation: "You have সংক্ষিপ্ত হয়ে You've হয়েছে। এখানে Tag Question ব্যবহার করা হয়েছে।" },
            { id: 11, bangla: "সে আমার বন্ধু।", standard: "He is my friend.", natural: "He's my friend.", pronunciation: "হিজ মাই ফ্রেন্ড।", explanation: "He is সংক্ষিপ্ত হয়ে He's হয়েছে।" },
            { id: 12, bangla: "আমরা প্রস্তুত।", standard: "We are ready.", natural: "We're ready.", pronunciation: "উইর রেডি।", explanation: "We are সংক্ষিপ্ত হয়ে We're হয়েছে।" },
            { id: 13, bangla: "এটা আমার দোষ নয়।", standard: "It is not my fault.", natural: "It's not my fault.", pronunciation: "ইটস নট মাই ফল্ট।", explanation: "It is সংক্ষিপ্ত হয়ে It's হয়েছে।" },
            { id: 14, bangla: "তুমি কি নিশ্চিত?", standard: "Are you sure?", natural: "You sure?", pronunciation: "ইউ শিওর?", explanation: "অনানুষ্ঠানিক কথোপকথনে Are বাদ দিয়ে প্রশ্ন করা যায়। পূর্ণ রূপটি বেশি Standard।" },
            { id: 15, bangla: "তুমি কি মজা করছ?", standard: "Are you joking?", natural: "You joking?", pronunciation: "ইউ জোকিং?", explanation: "কথ্য ইংরেজিতে প্রশ্নের শুরুতে Are বাদ দেওয়া হতে পারে।" },
            { id: 16, bangla: "আমি এটা পছন্দ করি না।", standard: "I do not like it.", natural: "I don't like it.", pronunciation: "আই ডোন্ট লাইক ইট।", explanation: "Do not এর সংক্ষিপ্ত রূপ Don't।" },
            { id: 17, bangla: "আমার যেতে হবে।", standard: "I must leave.", natural: "I've gotta go.", pronunciation: "আইভ গটা গো।", explanation: "Gotta হলো got to এর অনানুষ্ঠানিক রূপ। এটি বাধ্যবাধকতা বোঝায়।" },
            { id: 18, bangla: "আমার মনে হয় সে ঠিক বলেছে।", standard: "I think he is right.", natural: "I think he's right.", pronunciation: "আই থিংক হিজ রাইট।", explanation: "He is সংক্ষিপ্ত হয়ে He's হয়েছে।" },
            { id: 19, bangla: "তারা আমাদের জন্য অপেক্ষা করবে।", standard: "They will wait for us.", natural: "They'll wait for us.", pronunciation: "দেয়ল ওয়েইট ফর আস।", explanation: "They will সংক্ষিপ্ত হয়ে They'll হয়েছে।" },
            { id: 20, bangla: "তোমার এটা পছন্দ হবে।", standard: "You will like it.", natural: "You'll like it.", pronunciation: "ইউল লাইক ইট।", explanation: "You will সংক্ষিপ্ত হয়ে You'll হয়েছে।" },
            { id: 21, bangla: "আমি জানি না সে কোথায় গেছে।", standard: "I do not know where she has gone.", natural: "I don't know where she's gone.", pronunciation: "আই ডোন্ট নো হোয়ার শিজ গন।", explanation: "Do not থেকে Don't এবং She has থেকে She's হয়েছে। এখানে She's gone অর্থ সে চলে গেছে।" },
            { id: 22, bangla: "তুমি কি আমাকে বলবে?", standard: "Would you tell me?", natural: "Would ya tell me?", pronunciation: "উড ইয়া টেল মি?", explanation: "দ্রুত কথায় You দুর্বল হয়ে ya শোনাতে পারে। ভদ্রভাবে অনুরোধ করতে Would you ব্যবহার হয়।" },
            { id: 23, bangla: "সে আসতে চায় না।", standard: "He does not want to come.", natural: "He doesn't wanna come.", pronunciation: "হি ডাজন্ট ওয়ানা কাম।", explanation: "Does not থেকে Doesn't এবং Want to থেকে Wanna হয়েছে।" },
            { id: 24, bangla: "তুমি কি আমার কথা শুনেছ?", standard: "Have you heard me?", natural: "Have ya heard me?", pronunciation: "হ্যাভ ইয়া হার্ড মি?", explanation: "You দুর্বল উচ্চারণে ya হয়। এখানে Present Perfect Tense ব্যবহৃত হয়েছে।" },
            { id: 25, bangla: "আমি তোমাকে পরে জানাব।", standard: "I will let you know later.", natural: "I'll let ya know later.", pronunciation: "আইল লেট ইয়া নো লেইটার।", explanation: "I will থেকে I'll এবং you থেকে ya হয়েছে। এটি খুব পরিচিত দৈনন্দিন Expression।" }
        ];

        // Track states for each item (0: Initial/Bangla, 1: English revealed, 2: Explanation revealed)
        const cardStates = {};
        dataset.forEach(item => cardStates[item.id] = 0);

        // Convert digits to Bengali numbers
        function toBengaliNumeral(num) {
            const symbols = { '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯' };
            return num.toString().replace(/\d/g, d => symbols[d]);
        }

        // Render all cards
        function renderCards(filterText = '') {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            const filteredData = dataset.filter(item => {
                const search = filterText.toLowerCase().trim();
                return item.bangla.toLowerCase().includes(search) || 
                       item.natural.toLowerCase().includes(search) || 
                       item.standard.toLowerCase().includes(search) ||
                       item.id.toString().includes(search);
            });

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 glass-card rounded-2xl">
                        <i class="fa-solid fa-circle-exclamation text-4xl text-amber-400 mb-3"></i>
                        <p class="text-lg text-slate-300">কোন বাক্য খুঁজে পাওয়া যায়নি!</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach(item => {
                const state = cardStates[item.id];
                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-5 sm:p-6 transition-all duration-300 flex flex-col justify-between border-l-4 ${
                    state === 0 ? 'border-l-slate-500' : state === 1 ? 'border-l-blue-500' : 'border-l-emerald-500'
                }`;

                // Header with Badge & Title
                let cardHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-blue-400 border border-blue-500/30">
                                বাক্য নং - ${toBengaliNumeral(item.id)}
                            </span>
                            <span class="text-xs text-slate-400 flex items-center gap-1">
                                <i class="fa-solid fa-layer-group text-purple-400"></i> ধাপ ${toBengaliNumeral(state)} / ৩
                            </span>
                        </div>

                        <!-- Bangla Phrase (Always visible) -->
                        <div class="mb-4">
                            <h3 class="text-xl sm:text-2xl font-bold text-amber-300 leading-snug">
                                ${toBengaliNumeral(item.id)}. বাংলা: ${item.bangla}
                            </h3>
                        </div>
                `;

                // State 1 & 2: Natural English, Standard English, and Pronunciation
                if (state >= 1) {
                    cardHTML += `
                        <div class="space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 mb-4 animate-fadeIn">
                            <!-- Natural English with Audio -->
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-800">
                                <div>
                                    <span class="text-xs text-emerald-400 uppercase tracking-wider font-semibold">Natural Expression:</span>
                                    <p class="text-xl text-white font-bold english-text tracking-wide">${item.natural}</p>
                                </div>
                                <div class="flex gap-2 shrink-0 mt-1 sm:mt-0">
                                    <button onclick="speakText('${item.natural.replace(/'/g, "\\'")}', 'en-GB', this)" 
                                            class="btn-3d btn-3d-blue text-xs px-2.5 py-1.5 rounded-lg text-white font-semibold flex items-center gap-1.5">
                                        <i class="fa-solid fa-volume-high"></i> 🇬🇧 UK
                                    </button>
                                    <button onclick="speakText('${item.natural.replace(/'/g, "\\'")}', 'en-US', this)" 
                                            class="btn-3d btn-3d-purple text-xs px-2.5 py-1.5 rounded-lg text-white font-semibold flex items-center gap-1.5">
                                        <i class="fa-solid fa-volume-high"></i> 🇺🇸 US
                                    </button>
                                </div>
                            </div>

                            <!-- Standard English -->
                            <div>
                                <span class="text-xs text-slate-400 uppercase tracking-wider">Standard:</span>
                                <p class="text-base text-slate-300 english-text">${item.standard}</p>
                            </div>

                            <!-- Pronunciation in Bangla -->
                            <div class="pt-1">
                                <span class="text-xs text-amber-400/90 font-medium">বাংলা উচ্চারণ:</span>
                                <p class="text-base text-amber-200 font-semibold">${item.pronunciation}</p>
                            </div>
                        </div>
                    `;
                }

                // State 2: Detailed Explanation
                if (state >= 2) {
                    cardHTML += `
                        <div class="bg-indigo-950/40 border border-indigo-500/30 p-3.5 rounded-xl mb-4 text-indigo-100 text-sm leading-relaxed animate-fadeIn">
                            <div class="flex items-center gap-2 mb-1 text-indigo-300 font-bold text-xs uppercase tracking-wider">
                                <i class="fa-solid fa-lightbulb text-amber-400"></i> বিস্তারিত ব্যাখ্যা:
                            </div>
                            <p>${item.explanation}</p>
                        </div>
                    `;
                }

                cardHTML += `</div>`; // Close upper container

                // Action Step Button
                let btnLabel = '';
                let btnIcon = '';
                let btnColorClass = '';

                if (state === 0) {
                    btnLabel = 'ইংরেজি ও উচ্চারণ দেখুন';
                    btnIcon = 'fa-arrow-right';
                    btnColorClass = 'btn-3d-blue';
                } else if (state === 1) {
                    btnLabel = 'ব্যাখ্যা দেখুন';
                    btnIcon = 'fa-lightbulb';
                    btnColorClass = 'btn-3d-purple';
                } else {
                    btnLabel = 'পুনরায় সংকুচিত করুন';
                    btnIcon = 'fa-compress';
                    btnColorClass = 'btn-3d-amber';
                }

                cardHTML += `
                    <div class="pt-2">
                        <button onclick="cycleCardState(${item.id})" 
                                class="btn-3d ${btnColorClass} w-full py-2.5 px-4 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 shadow-lg">
                            <span>${btnLabel}</span>
                            <i class="fa-solid ${btnIcon}"></i>
                        </button>
                    </div>
                `;

                card.innerHTML = cardHTML;
                container.appendChild(card);
            });

            updateProgress();
        }

        // Cycle states for a specific card
        function cycleCardState(id) {
            cardStates[id] = (cardStates[id] + 1) % 3;
            renderCards(document.getElementById('search-input').value);
        }

        // Global Reveal All
        function revealAllCards() {
            dataset.forEach(item => cardStates[item.id] = 2);
            renderCards(document.getElementById('search-input').value);
        }

        // Global Reset All
        function resetAllCards() {
            dataset.forEach(item => cardStates[item.id] = 0);
            renderCards(document.getElementById('search-input').value);
        }

        // Progress Bar Updater
        function updateProgress() {
            const total = dataset.length;
            const revealed = Object.values(cardStates).filter(state => state > 0).length;
            const percentage = Math.round((revealed / total) * 100);

            document.getElementById('progress-text').innerText = `${toBengaliNumeral(revealed)} / ${toBengaliNumeral(total)}`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        // Text-To-Speech (TTS) Engine
        function speakText(text, langCode, buttonElement) {
            if (!('speechSynthesis' in window)) {
                alert('আপনার ব্রাউজারে স্পিচ ফিচারটি সাপোর্ট করে না।');
                return;
            }

            // Cancel any current speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            utterance.rate = 0.9; // Slightly slower for better clarity

            // Find matching accent voices if available
            const voices = window.speechSynthesis.getVoices();
            const matchingVoice = voices.find(voice => voice.lang.includes(langCode) || voice.lang.replace('_', '-').includes(langCode));
            if (matchingVoice) {
                utterance.voice = matchingVoice;
            }

            // Add visual animation to button while speaking
            const originalIconHTML = buttonElement.innerHTML;
            buttonElement.classList.add('speaking');
            buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> প্লে হচ্ছে...`;

            utterance.onend = () => {
                buttonElement.classList.remove('speaking');
                buttonElement.innerHTML = originalIconHTML;
            };

            utterance.onerror = () => {
                buttonElement.classList.remove('speaking');
                buttonElement.innerHTML = originalIconHTML;
            };

            window.speechSynthesis.speak(utterance);
        }

        // Initialize voices for mobile browsers
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Search Input Listener
        document.getElementById('search-input').addEventListener('input', (e) => {
            renderCards(e.target.value);
        });

        // Initial Render on Load
        window.onload = () => {
            renderCards();
        };
    </script>
</body>
</html>
