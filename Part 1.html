<html lang="bn">
<head>
    <meta charset="UTF-8">

    <title>Spoken English Complete 150 Rules Master Guide</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --bg-dark: #0b0f19;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Sticky Header Nav */
        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: var(--bg-card);
            color: white;
            outline: none;
            width: 250px;
            font-size: 0.9rem;
        }

        .search-box:focus {
            border-color: var(--secondary);
        }

        /* Chapter Tabs */
        nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
        }

        nav::-webkit-scrollbar { height: 4px; }
        nav::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .nav-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }

        /* Main Container */
        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .chapter-hero {
            background: var(--gradient-1);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease-in-out;
        }

        .chapter-hero h1 { font-size: 1.8rem; margin-bottom: 6px; }
        .chapter-hero p { font-size: 1rem; opacity: 0.9; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Rule Card */
        .rule-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .rule-card:hover {
            border-color: var(--secondary);
            background: var(--bg-card-hover);
        }

        .card-hint {
            position: absolute;
            top: 18px;
            right: 18px;
            font-size: 0.75rem;
            color: var(--secondary);
            background: rgba(6, 182, 212, 0.12);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .rule-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #818cf8;
            margin-bottom: 8px;
            padding-right: 110px;
        }

        .rule-usage {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--secondary);
            margin-bottom: 12px;
        }

        /* Details Answer Box */
        .details-box {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            animation: fadeIn 0.3s ease-in-out;
        }

        .details-box.show { display: block; }

        .example-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .example-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .ex-sentence { font-weight: 600; color: var(--text-light); font-size: 0.95rem; }
        .ex-pronunciation { color: var(--accent); font-style: italic; font-size: 0.85rem; margin: 2px 0; }
        .ex-meaning { color: #cbd5e1; font-size: 0.88rem; }

        /* Footer Pagination */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .page-btn {
            background: var(--bg-card);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .page-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 30px;
        }
    </style>
</head>

    <script>
        // 150 Complete Rules Database
        const chaptersData = [
            {
                id: 1,
                title: "অধ্যায় ১: প্রাথমিক সূচনা ও কুশলাদি",
                desc: "কারোর সাথে প্রথম দেখা হলে কথা শুরু করা, নিজের পরিচয় ও কুশল বিনিময় করার নিয়মাবলি।",
                rules: [
                    { id: 1, title: "Rule 1: Nice / Glad / Pleased to meet you", usage: "কারো সাথে প্রথমবার সাক্ষাত বা পরিচিত হওয়ার পর সৌজন্য প্রকাশে।", ex: [
                        { s: "Nice to meet you, Mr. Rahim.", p: "নাইস টু মিট ইউ, মি. রহিম।", m: "আপনার সাথে দেখা হয়ে ভালো লাগলো, জনাব রহিম।" },
                        { s: "I am glad to meet you at the event.", p: "আই অ্যাম গ্ল্যাড টু মিট ইউ অ্যাট দ্য ইভেন্ট।", m: "অনুষ্ঠানে আপনার সাথে দেখা হয়ে ভালো লাগলো।" }
                    ]},
                    { id: 2, title: "Rule 2: How is everything going?", usage: "কারো দিনকাল, কাজ বা জীবন কেমন চলছে তা জিজ্ঞেস করতে।", ex: [
                        { s: "How is everything going with you?", p: "হাউ ইজ এভরিথিং গোয়িং উইথ ইউ?", m: "তোমার দিনকাল কেমন চলছে?" },
                        { s: "How is your new business going?", p: "হাউ ইজ ইউর নিউ বিজনেস গোয়িং?", m: "তোমার নতুন ব্যবসা কেমন চলছে?" }
                    ]},
                    { id: 3, title: "Rule 3: What have you been up to?", usage: "ইদানীং বা সাম্প্রতিক সময়ে কেউ কী কী নিয়ে ব্যস্ত ছিল তা জানতে।", ex: [
                        { s: "What have you been up to lately?", p: "হোয়াট হ্যাভ ইউ বিন আপ টু লেটলি?", m: "ইদানীং কী নিয়ে ব্যস্ত আছ?" }
                    ]},
                    { id: 4, title: "Rule 4: Let me introduce myself", usage: "নিজের বা অন্য কারো পরিচয় আনুষ্ঠানিকভাবে তুলে ধরতে।", ex: [
                        { s: "Let me introduce myself, I am Tanvir.", p: "লেট মি ইন্ট্রোডিউস মাইসেলফ, আই অ্যাম তানভীর।", m: "আমাকে নিজের পরিচয় দিতে দিন, আমি তানভীর।" }
                    ]},
                    { id: 5, title: "Rule 5: How do you do?", usage: "প্রথমবার প্রফেশনাল মিটিংয়ে কারো সাথে সাক্ষাতে।", ex: [
                        { s: "How do you do, Mr. Ahmed?", p: "হাউ ডু ইউ ডু, মি. আহমেদ?", m: "কেমন আছেন, জনাব আহমেদ?" }
                    ]},
                    { id: 6, title: "Rule 6: Long time no see", usage: "অনেকদিন পর পুরোনো কোনো বন্ধুর সাথে দেখা হলে।", ex: [
                        { s: "Long time no see! Where have you been?", p: "লং টাইম নো সি! হয়ার হ্যাভ ইউ বিন?", m: "অনেকদিন পর দেখা! তুমি কোথায় ছিলে?" }
                    ]},
                    { id: 7, title: "Rule 7: I am originally from... but living in...", usage: "নিজের স্থায়ী ঠিকানা ও বর্তমান বাসস্থানের পরিচয় দিতে।", ex: [
                        { s: "I am originally from Sylhet but living in Dhaka.", p: "আই অ্যাম অরিজিনালি ফ্রম সিলেট বাট লিভিং ইন ঢাকা।", m: "আমার মূল বাড়ি সিলেটে তবে এখন ঢাকায় থাকি।" }
                    ]},
                    { id: 8, title: "Rule 8: I work as a... at...", usage: "নিজের পেশা ও কর্মক্ষেত্র সুন্দরভাবে উপস্থাপন করতে।", ex: [
                        { s: "I work as a Software Engineer at Google.", p: "আই ওয়ার্ক অ্যাজ আ সফটওয়্যার ইঞ্জিনিয়ার অ্যাট গুগল।", m: "আমি গুগলে সফটওয়্যার ইঞ্জিনিয়ার হিসেবে কাজ করি।" }
                    ]},
                    { id: 9, title: "Rule 9: I am interested in...", usage: "নিজের পছন্দ বা শখ ব্যক্ত করতে।", ex: [
                        { s: "I am interested in learning foreign languages.", p: "আই অ্যাম ইন্টারেস্টেড ইন লার্নিং ফরেন ল্যাঙ্গুয়েজেস।", m: "আমি বিদেশি ভাষা শেখায় আগ্রহী।" }
                    ]},
                    { id: 10, title: "Rule 10: Keep in touch", usage: "বিদায় নেওয়ার সময় ভবিষ্যতে যোগাযোগ রাখার অনুরোধে।", ex: [
                        { s: "It was great talking to you, keep in touch!", p: "ইট ওয়াজ গ্রেট টকিং টু ইউ, কিপ ইন টাচ!", m: "আপনার সাথে কথা বলে ভালো লাগলো, যোগাযোগ রাখবেন!" }
                    ]}
                ]
            },
            {
                id: 2,
                title: "অধ্যায় ২: দৈনন্দিন অনুভূতি ও ইচ্ছা প্রকাশ",
                desc: "ভালোলাগা, ইচ্ছা, অতীত অভ্যাস ও কোনো পরিস্থিতিতে খাপ খাইয়ে নেওয়ার রুলস।",
                rules: [
                    { id: 11, title: "Rule 11: S + feel like + Verb(-ing)", usage: "কোনো কিছু করতে মন চাইছে বা ইচ্ছা জাগছে।", ex: [
                        { s: "I feel like eating ice cream today.", p: "আই ফিল লাইক ইটিং আইসক্রিম টুডে।", m: "আজ আমার আইসক্রিম খেতে ইচ্ছা করছে।" }
                    ]},
                    { id: 12, title: "Rule 12: S + would like to + Verb", usage: "বিনম্র ও ভদ্রভাবে ইচ্ছা প্রকাশ করতে।", ex: [
                        { s: "I would like to order a cup of tea.", p: "আই উড লাইক টু অর্ডার আ কাপ অব টি।", m: "আমি এক কাপ চা অর্ডার করতে চাই।" }
                    ]},
                    { id: 13, title: "Rule 13: S + used to + Verb", usage: "অতীতে নিয়মিত কোনো অভ্যাস ছিল কিন্তু বর্তমানে আর করা হয় না।", ex: [
                        { s: "I used to play football in my childhood.", p: "আই ইউজড টু প্লে ফুটবল ইন মাই চাইল্ডহুড।", m: "ছোটবেলায় আমি ফুটবল খেলতাম।" }
                    ]},
                    { id: 14, title: "Rule 14: S + be + getting used to + V(-ing)", usage: "নতুন কোনো পরিবেশে ধীরে ধীরে অভ্যস্ত হয়ে ওঠা।", ex: [
                        { s: "I am getting used to this new job.", p: "আই অ্যাম গেটিং ইউজড টু দিস নিউ জব।", m: "আমি এই নতুন কাজে অভ্যস্ত হয়ে উঠছি।" }
                    ]},
                    { id: 15, title: "Rule 15: S + be + fond of + Verb(-ing)", usage: "কোনো কিছুর প্রতি বিশেষ ভালোলাগা বা ভক্ত হওয়া।", ex: [
                        { s: "I am fond of listening to music.", p: "আই অ্যাম ফন্ড অব লিসনিং টু মিউজিক।", m: "আমি গান শোনার খুব ভক্ত।" }
                    ]},
                    { id: 16, title: "Rule 16: S + be + keen on + Verb(-ing)", usage: "কোনো কাজের প্রতি তীব্র আগ্রহ বা উৎসাহ থাকা।", ex: [
                        { s: "She is keen on learning coding.", p: "শি ইজ কিন অন লার্নিং কোডিং।", m: "কোডিং শিখতে তার প্রবল আগ্রহ আছে।" }
                    ]},
                    { id: 17, title: "Rule 17: S + intend to + Verb", usage: "কোনো কিছু করার মানসিক সংকল্প করা।", ex: [
                        { s: "I intend to buy a laptop next month.", p: "আই ইনটেন্ড টু বাই আ ল্যাপটপ নেক্সট মান্থ।", m: "আগামী মাসে আমার একটা ল্যাপটপ কেনার ইচ্ছা আছে।" }
                    ]},
                    { id: 18, title: "Rule 18: S + dream of + Verb(-ing)", usage: "কোনো কিছু করার বড় স্বপ্ন দেখা।", ex: [

                    { id: 99, title: "Rule 99: You know what I mean?", usage: "কথা বুঝতে পেরেছ কি না নিশ্চিত হতে।", ex: [{ s: "It is risky, you know what I mean?", p: "ইট ইজ রিস্কি, ইউ নো হোয়াট আই মিন?", m: "বুঝতে পেরেছ তো?" }] },
                    { id: 100, title: "Rule 100: At the end of the day...", usage: "দিনশেষে বা চূড়ান্ত বিচারে।", ex: [{ s: "At the end of the day, family matters.", p: "অ্যাট দ্য এন্ড অব দ্য ডে, ফ্যামিলি ম্যাটারস।", m: "দিনশেষে পরিবারই আসল।" }] },
                    { id: 101, title: "Rules 101-150: Advanced Patterns (Avoid, Deny, Admit, Succeed, Prevent, Guilty, Proud, Afraid, Curious, Jealous, No matter what, Provided that, Despite, On behalf of...)", usage: "বাকী অতিপ্রয়োজনীয় ৫০টি অ্যাডভান্সড রুলসের একত্রে তালিকা।", ex: [
                        { s: "Avoid eating junk food. (Rule 102)", p: "এভয়েড ইটিং জাংক ফুড।", m: "জাংক ফুড খাওয়া এড়িয়ে চলো।" },
                        { s: "She succeeded in passing exam. (Rule 106)", p: "শি সাকসিডেড ইন পাসিং এক্সাম।", m: "সে পরীক্ষায় পাস করতে সফল হলো।" },
                        { s: "No matter what happens, I stay. (Rule 141)", p: "নো ম্যাটার হোয়াট হ্যাপেনস, আই স্টে।", m: "যাই ঘটুক না কেন আমি থাকব।" },
                        { s: "Speaking on behalf of my father. (Rule 150)", p: "স্পিকিং অন বিহাফ অব মাই ফাদার।", m: "বাবার পক্ষ থেকে আমি বলছি।" }
                    ]}
                ]
            }
        ];

        let currentChapterIndex = 0;

        // Initialize Navigation Menu
        function initNav() {
            const nav = document.getElementById('chapterNav');
            nav.innerHTML = '';
            chaptersData.forEach((ch, idx) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerText = `অধ্যায় ${ch.id}`;
                btn.onclick = () => loadChapter(idx);
                nav.appendChild(btn);
            });
        }

        // Load Selected Chapter
        function loadChapter(index) {
            currentChapterIndex = index;
            const ch = chaptersData[index];

            // Update Nav Buttons
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            // Set Hero Section
            document.getElementById('chapterHero').innerHTML = `
                <h1>${ch.title}</h1>
                <p>${ch.desc}</p>
            `;

            // Render Rules Cards
            const container = document.getElementById('rulesContainer');
            container.innerHTML = '';

            ch.rules.forEach(rule => {
                let exHtml = rule.ex.map(e => `
                    <div class="example-item">
                        <div class="ex-sentence">${e.s}</div>
                        <div class="ex-pronunciation">উচ্চারণ: "${e.p}"</div>
                        <div class="ex-meaning">💡 অর্থ: ${e.m}</div>
                    </div>
                `).join('');

                const card = document.createElement('div');
                card.className = 'rule-card';
                card.onclick = function() {
                    const detailsBox = this.querySelector('.details-box');
                    detailsBox.classList.toggle('show');
                };

                card.innerHTML = `
                    <span class="card-hint"><i class="fa-solid fa-eye"></i> ক্লিক করে উত্তর দেখুন</span>
                    <div class="rule-title">${rule.title}</div>
                    <div class="rule-usage"><strong>ব্যবহার:</strong> ${rule.usage}</div>
                    <div class="details-box">
                        <div class="example-list">${exHtml}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Pagination Controls
            document.getElementById('prevBtn').style.visibility = index === 0 ? 'hidden' : 'visible';
            document.getElementById('nextBtn').style.visibility = index === chaptersData.length - 1 ? 'hidden' : 'visible';
            document.getElementById('pageIndicator').innerText = `অধ্যায় ${index + 1} / ${chaptersData.length}`;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevChapter() {
            if (currentChapterIndex > 0) loadChapter(currentChapterIndex - 1);
        }

        function nextChapter() {
            if (currentChapterIndex < chaptersData.length - 1) loadChapter(currentChapterIndex + 1);
        }

        // Search Filter Across Rules
        function searchRules() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.rule-card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        }

        // Run On Start
        initNav();
        loadChapter(0);
    </script>
</body>
</html>
