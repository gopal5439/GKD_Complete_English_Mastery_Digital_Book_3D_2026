                bn: "আমি তোমার ওপর বিশ্বাস করি।",
                en: "I believe in you.",
                uccharon: "আই বিলিভ ইন ইউ।",
                exp: "কারও যোগ্যতা বা সামর্থ্যের ওপর আস্থা প্রকাশ করতে বাক্যটি ব্যবহার করা হয়। Believe in someone অর্থ কাউকে বিশ্বাস করা বা তার সক্ষমতার ওপর আস্থা রাখা।"
            },
            {
                num: "২৯৭",
                bn: "আমি তোমার জন্য খুব খুশি।",
                en: "I am very happy for you.",
                uccharon: "আই অ্যাম ভেরি হ্যাপি ফর ইউ।",
                exp: "অন্য কারও সাফল্য বা আনন্দের ঘটনায় নিজের আনন্দ প্রকাশ করতে এটি বলা হয়। Happy for you অর্থ তোমার আনন্দে আমিও আনন্দিত।"
            },
            {
                num: "২৯৮",
                bn: "আমি আর অপেক্ষা করতে পারছি না।",
                en: "I can't wait any longer.",
                uccharon: "আই ক্যান্ট ওয়েইট এনি লঙ্গার।",
                exp: "আর অপেক্ষা করা সম্ভব হচ্ছে না—এমন অধৈর্য বা আগ্রহের অনুভূতি বোঝাতে বাক্যটি ব্যবহার করা হয়। Can't হলো cannot-এর সংক্ষিপ্ত রূপ।"
            },
            {
                num: "২৯৯",
                bn: "আমি নিজেকে নিয়ে সন্তুষ্ট।",
                en: "I am satisfied with myself.",
                uccharon: "আই অ্যাম স্যাটিসফাইড উইথ মাইসেল্ফ।",
                exp: "নিজের কাজ বা অবস্থার প্রতি সন্তুষ্টি প্রকাশ করতে বাক্যটি বলা হয়। Satisfied with অর্থ কোনো ব্যক্তি বা বিষয়ে সন্তুষ্ট হওয়া।"
            },
            {
                num: "৩০০",
                bn: "আমি কখনো আশা হারাই না।",
                en: "I never lose hope.",
                uccharon: "আই নেভার লুজ হোপ।",
                exp: "কঠিন পরিস্থিতিতেও আশাবাদী থাকার মনোভাব প্রকাশ করতে বাক্যটি ব্যবহার করা হয়। Never অর্থ কখনোই না এবং lose hope অর্থ আশা হারানো।"
            }
        ];

        const container = document.getElementById('cards-container');

        // Create Card HTML Elements
        sentencesData.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-step', '0');

            card.innerHTML = `
                <div class="card-header">
                    <span class="sentence-num">${data.num}</span>
                    <div class="bn-text">${data.bn}</div>
                    <span class="step-indicator" id="step-ind-${index}">ক্লিক করুন</span>
                </div>
                
                <div class="content-reveal" id="reveal-${index}">
                    <div class="en-box">
                        <div class="en-text">${data.en}</div>
                        <div class="uccharon-text">উচ্চারণ: ${data.uccharon}</div>
                        <div class="voice-btn-group">
                            <button class="voice-btn us" onclick="speakText(event, '${escapeQuotes(data.en)}', 'en-US')">
                                <i class="fa-solid fa-volume-high"></i> US Accent
                            </button>
                            <button class="voice-btn uk" onclick="speakText(event, '${escapeQuotes(data.en)}', 'en-GB')">
                                <i class="fa-solid fa-volume-high"></i> UK Accent
                            </button>
                        </div>
                    </div>
                    <div class="explanation-box" id="exp-${index}">
                        <strong>ব্যাখ্যা:</strong> ${data.exp}
                    </div>
                </div>
            `;

            // Card Toggle Click Logic
            card.addEventListener('click', (e) => {
                // Prevent toggle if clicking audio buttons
                if (e.target.closest('.voice-btn')) return;

                let currentStep = parseInt(card.getAttribute('data-step'));
                const revealBox = document.getElementById(`reveal-${index}`);
                const expBox = document.getElementById(`exp-${index}`);
                const indicator = document.getElementById(`step-ind-${index}`);

                if (currentStep === 0) {
                    // Step 1: Reveal English & Pronunciation
                    revealBox.style.display = 'block';
                    card.setAttribute('data-step', '1');
                    indicator.innerText = '১/২ স্টেপ';
                    indicator.style.color = '#38bdf8';
                } else if (currentStep === 1) {
                    // Step 2: Reveal Explanation
                    expBox.style.display = 'block';
                    card.setAttribute('data-step', '2');
                    indicator.innerText = 'সম্পূর্ণ';
                    indicator.style.color = '#c084fc';
                } else {
                    // Step 3: Reset
                    revealBox.style.display = 'none';
                    expBox.style.display = 'none';
                    card.setAttribute('data-step', '0');
                    indicator.innerText = 'ক্লিক করুন';
                    indicator.style.color = '#94a3b8';
                }
            });

            container.appendChild(card);
        });

        // Helper to avoid quote issues in onclick string
        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        // Text-to-Speech Functionality
        function speakText(event, text, lang) {
            event.stopPropagation(); // Prevents card toggle on button click
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9; // Slightly slower for clear learning
                window.speechSynthesis.speak(utterance);
            } else {
                alert("দুঃখিত, আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই।");
            }
        }
    </script>
