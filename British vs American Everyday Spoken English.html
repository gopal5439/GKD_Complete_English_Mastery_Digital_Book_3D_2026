            transform: translateY(4px);
            box-shadow: 0 0 0 #be123c, 0 2px 4px rgba(0,0,0,0.2);

        .card:active {

        }

        .card-header {

            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 12px;

            font-weight: bold;
            font-size: 0.85rem;

            font-weight: bold;
            color: #0f172a;
            line-height: 1.3;

            color: #6b21a8;

        .tag-pron {

            color: #92400e;

        .english-text {

            font-family: var(--font-english);

            color: #059669;
            font-weight: 600;
        }

        .audio-btns {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }

        .btn-audio {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 5px 10px;
            border-radius: 8px;
            font-family: var(--font-english);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 0 #94a3b8;

            gap: 4px;
            color: #334155;

            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-audio:active {
            transform: translateY(2px);

        }

        /* Explanation Styling */
        .explanation-content {
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-purple);
            font-family: var(--font-bangla);
            font-size: 1rem;
            color: #334155;
            line-height: 1.5;
        }

        /* Hint Text on Card */
        .click-hint {
            display: block;
            text-align: right;
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 10px;
            font-style: italic;
        }

        /* Empty state */
        .no-results {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2rem;
            display: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 1.45rem; }
            .bangla-text { font-size: 1.25rem; }
            .english-text { font-size: 1.15rem; flex-wrap: wrap; }
            .controls-panel { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: space-between; }
            .btn-3d { flex: 1; justify-content: center; }
        }
    </style>

            { id: 19, bn: "আমরা কি সময়টা একটু এগিয়ে আনতে পারি?", std: "Can we move the time a little earlier?", nat: "Can we make it a bit earlier?", pron: "ক্যান উই মেইক ইট আ বিট আর্লিয়ার?", exp: "কোনো নির্ধারিত কাজের সময় আগে করতে চাইলে বলা হয়।" },
            { id: 20, bn: "আজকের পরিকল্পনাটা বাতিল করতে হচ্ছে।", std: "I have to cancel today's plan.", nat: "I have to call off today's plan.", pron: "আই হ্যাভ টু কল অফ টুডেজ প্ল্যান।", exp: "“Call off” অর্থ কোনো পরিকল্পনা বা অনুষ্ঠান বাতিল করা।" },
            { id: 21, bn: "কোনো সমস্যা নেই, অন্যদিন হবে।", std: "No problem, we can do it another day.", nat: "No worries. We can do it another time.", pron: "নো ওয়ারিজ। উই ক্যান ডু ইট অ্যানাদার টাইম।", exp: "পরিকল্পনা পরিবর্তন হলে স্বাভাবিকভাবে ইতিবাচক প্রতিক্রিয়া জানাতে বলা হয়।" },
            { id: 22, bn: "আমাকে একটু আগে জানিয়ে দিও।", std: "Please inform me a little earlier.", nat: "Give me a heads-up beforehand.", pron: "গিভ মি আ হেডস-আপ বিফোরহ্যান্ড।", exp: "“Heads-up” অর্থ আগাম সতর্কতা বা কোনো বিষয়ে আগে থেকে জানানো।" },
            { id: 23, bn: "আমি চেষ্টা করব সময়মতো আসতে।", std: "I will try to arrive on time.", nat: "I'll try to make it on time.", pron: "আইল ট্রাই টু মেইক ইট অন টাইম।", exp: "কোনো অনুষ্ঠানে বা সাক্ষাতে সময়মতো পৌঁছানোর চেষ্টা বোঝাতে ব্যবহার হয়।" },
            { id: 24, bn: "আজকের সময়টা বেশ ভালো কাটল।", std: "I had a very good time today.", nat: "I had a great time today.", pron: "আই হ্যাড আ গ্রেইট টাইম টুডে।", exp: "কারও সঙ্গে সময় কাটিয়ে আনন্দ পেলে বলা হয়।" },
            { id: 25, bn: "আবার শিগগিরই দেখা হবে।", std: "We will meet again soon.", nat: "See you again soon.", pron: "সি ইউ অ্যাগেইন সুন।", exp: "বিদায়ের সময় ভবিষ্যতে আবার দেখা হওয়ার আশা প্রকাশ করতে ব্যবহার হয়।" }
        ];

        // Track states
        const cardStates = {};

        // Render Cards
        function renderCards() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            dataset.forEach(item => {
                cardStates[item.id] = cardStates[item.id] || 0;

                const card = document.createElement('div');
                card.className = `card state-${cardStates[item.id]}`;
                card.id = `card-${item.id}`;
                card.onclick = (e) => handleCardClick(e, item.id);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-num">${item.id}</div>
                        <div class="step-indicator" id="step-ind-${item.id}">
                            ${getStepLabel(cardStates[item.id])}
                        </div>
                    </div>

                    <div class="bangla-box">
                        <div class="bangla-text">${item.bn}</div>
                    </div>

                    <div class="english-section">
                        <div class="english-item">
                            <span class="badge-tag tag-natural">Natural Spoken</span>
                            <div class="english-text">
                                <span>${item.nat}</span>
                                <div class="audio-btns">
                                    <button class="btn-audio" onclick="speakText(event, '${escapeQuotes(item.nat)}', 'en-GB')">🇬🇧 UK</button>
                                    <button class="btn-audio" onclick="speakText(event, '${escapeQuotes(item.nat)}', 'en-US')">🇺🇸 US</button>
                                </div>
                            </div>
                        </div>

                        <div class="english-item">
                            <span class="badge-tag tag-standard">Standard English</span>
                            <div class="standard-text">${item.std}</div>
                        </div>

                        <div class="english-item">
                            <span class="badge-tag tag-pron">উচ্চারণ</span>
                            <div class="pronunciation-text">${item.pron}</div>
                        </div>
                    </div>

                    <div class="explanation-section">
                        <div class="explanation-content">
                            <strong>ব্যাখ্যা:</strong> ${item.exp}
                        </div>
                    </div>

                    <span class="click-hint" id="hint-${item.id}">${getHintText(cardStates[item.id])}</span>
                `;

                container.appendChild(card);
            });
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        function getStepLabel(state) {
            if (state === 0) return 'ক্লিক করুন (১/২)';
            if (state === 1) return 'ক্লিক করুন (২/২)';
            return 'সম্পূর্ণ দেখুন (রিসেট)';
        }

        function getHintText(state) {
            if (state === 0) return '👉 ক্লিক করে ইংরেজি ও উচ্চারণ দেখুন';
            if (state === 1) return '👉 ক্লিক করে ব্যাখ্যা দেখুন';
            return '👈 আবার প্রথম অবস্থায় নিয়ে যেতে ক্লিক করুন';
        }

        function handleCardClick(e, id) {
            if (e.target.closest('.btn-audio')) return;

            cardStates[id] = (cardStates[id] + 1) % 3;
            
            const card = document.getElementById(`card-${id}`);
            card.className = `card state-${cardStates[id]}`;
            
            document.getElementById(`step-ind-${id}`).innerText = getStepLabel(cardStates[id]);
            document.getElementById(`hint-${id}`).innerText = getHintText(cardStates[id]);
        }

        function toggleAllCards(show) {
            dataset.forEach(item => {
                cardStates[item.id] = show ? 2 : 0;
            });
            renderCards();
        }

        function speakText(event, text, lang) {
            event.stopPropagation();

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;

                const voices = window.speechSynthesis.getVoices();
                const selectedVoice = voices.find(v => v.lang.includes(lang) || v.lang.replace('_', '-').includes(lang));
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert("দুঃখিত, আপনার ব্রাউজারে অডিও প্লেয়ার সাপোর্টেড নয়।");
            }
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let visibleCount = 0;

            dataset.forEach(item => {
                const card = document.getElementById(`card-${item.id}`);
                const match = item.bn.toLowerCase().includes(query) || 
                              item.nat.toLowerCase().includes(query) || 
                              item.std.toLowerCase().includes(query) ||
                              item.pron.toLowerCase().includes(query);

                if (match) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Initialize
        renderCards();
    </script>
</body>
</html>
