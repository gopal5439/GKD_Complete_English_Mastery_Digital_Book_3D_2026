        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 20px 40px -10px rgba(168, 85, 247, 0.25), 
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.4);
        }

        /* 3D Button Press Effect */
        .btn-3d {
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 #4c1d95, 0 6px 12px rgba(0, 0, 0, 0.4);
            position: relative;
            top: 0;
        }

        .btn-3d:active {
            top: 3px;
            box-shadow: 0 1px 0 #4c1d95, 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        /* Smooth Accordion Animations */
        .expandable-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .expandable-content.open {
            grid-template-rows: 1fr;
        }

        .inner-content {
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #4c1d95;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6d28d9;
        }

        /* Glowing Badge Animation */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        .glow-effect {
            animation: pulse-glow 3s infinite ease-in-out;

        // State variables
        // Card step tracker: key = card id, value = 1 (Default/BN), 2 (English+Pron), 3 (Explanation)
        const cardStates = {};
        itemsData.forEach(item => cardStates[item.id] = 1);

        let selectedAccent = 'en-US'; // Default US Accent

        // Speech Synthesis Setup
        const synth = window.speechSynthesis;

        function speakText(text) {
            if (!synth) {
                alert('দুঃখিত, আপনার ব্রাউজার স্পিচ সাপোর্ট করে না।');
                return;
            }
            // Cancel ongoing speech
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = selectedAccent;
            utterance.rate = 0.9; // Slightly calm speed for clarity
            utterance.pitch = 1.0;

            synth.speak(utterance);
        }

        // Render Cards Function
        function renderCards(filterText = '') {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const filteredData = itemsData.filter(item => {
                const search = filterText.toLowerCase();
                return item.bn.toLowerCase().includes(search) || 
                       item.stdEn.toLowerCase().includes(search) || 
                       item.natEn.toLowerCase().includes(search) || 
                       item.pron.toLowerCase().includes(search);
            });

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 text-center rounded-2xl text-purple-300">
                        <i class="fa-regular fa-face-frown text-4xl mb-3"></i>
                        <p class="text-lg">কোনো ফলাফল পাওয়া যায়নি!</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach(item => {
                const step = cardStates[item.id];
                
                // HTML Template for Card
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-4 md:p-6 cursor-pointer select-none border transition-all duration-300';
                card.setAttribute('data-id', item.id);

                card.innerHTML = `
                    <!-- Header Step 1: Number & Bangla -->
                    <div class="flex items-start justify-between gap-3" onclick="handleCardClick(${item.id})">
                        <div class="flex items-start gap-3.5">
                            <span class="flex-shrink-0 w-8 h-8 md:w-10 md:h-10 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-md text-sm md:text-base font-english">
                                ${item.id}
                            </span>
                            <div>
                                <h3 class="text-lg md:text-xl font-bold text-white leading-snug">
                                    ${item.bn}
                                </h3>
                                <p class="text-xs text-purple-300/70 mt-1 flex items-center gap-1">
                                    ${step === 1 ? '<i class="fa-solid fa-hand-pointer text-pink-400"></i> ইংরেজি দেখতে ক্লিক করুন' : 
                                      step === 2 ? '<i class="fa-solid fa-hand-pointer text-cyan-400"></i> ব্যাখ্যা দেখতে আবার ক্লিক করুন' : 
                                      '<i class="fa-solid fa-circle-check text-green-400"></i> সম্পূর্ণ তথ্য দেখা যাচ্ছে'}
                                </p>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${step === 1 ? 'bg-purple-900/60 text-purple-300' : step === 2 ? 'bg-cyan-900/60 text-cyan-300' : 'bg-pink-900/60 text-pink-300'}">
                                ধাপ ${step}/৩
                            </span>
                            <div class="w-8 h-8 rounded-full bg-slate-800/80 flex items-center justify-center text-purple-300">
                                <i class="fa-solid ${step === 3 ? 'fa-chevron-up' : 'fa-chevron-down'} transition-transform duration-300"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Step 2 Content: Standard, Natural English & Pronunciation -->
                    <div class="expandable-content ${step >= 2 ? 'open' : ''}">
                        <div class="inner-content pt-4 mt-3 border-t border-purple-500/20">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                                <!-- Standard English -->
                                <div class="bg-slate-900/70 p-3.5 rounded-xl border border-slate-700/60 hover:border-purple-500/40 transition-colors group"
                                     onclick="event.stopPropagation(); speakText('${item.stdEn.replace(/'/g, "\\'")}')">
                                    <div class="flex items-center justify-between text-xs text-purple-300 mb-1">
                                        <span class="font-semibold"><i class="fa-solid fa-book-bookmark text-indigo-400 mr-1"></i>Standard English:</span>
                                        <i class="fa-solid fa-volume-high text-purple-400 group-hover:scale-110 transition-transform"></i>
                                    </div>
                                    <p class="font-english text-base md:text-lg text-indigo-200 font-semibold">
                                        ${item.stdEn}
                                    </p>
                                </div>

                                <!-- Natural Spoken English -->
                                <div class="bg-purple-950/40 p-3.5 rounded-xl border border-purple-500/40 hover:border-pink-500/50 transition-colors group relative"
                                     onclick="event.stopPropagation(); speakText('${item.natEn.replace(/'/g, "\\'")}')">
                                    <div class="flex items-center justify-between text-xs text-pink-300 mb-1">
                                        <span class="font-semibold"><i class="fa-solid fa-comments text-pink-400 mr-1"></i>Natural Spoken English:</span>
                                        <span class="bg-pink-500/20 text-pink-300 text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">
                                            <i class="fa-solid fa-volume-high"></i> শুনুন
                                        </span>
                                    </div>
                                    <p class="font-english text-lg md:text-xl text-pink-200 font-bold">
                                        "${item.natEn}"
                                    </p>
                                </div>
                            </div>

                            <!-- Pronunciation (বাংলা উচ্চারণ) -->
                            <div class="bg-slate-900/50 p-3 rounded-xl border border-purple-900/30 flex items-center gap-2">
                                <span class="text-xs font-bold text-cyan-400 bg-cyan-950/60 px-2 py-1 rounded-md flex-shrink-0">
                                    উচ্চারণ:
                                </span>
                                <span class="text-sm md:text-base text-cyan-100 font-medium">
                                    ${item.pron}
                                </span>
                            </div>

                            <!-- Step 3 Content: Explanation (ব্যাখ্যা) -->
                            <div class="expandable-content ${step === 3 ? 'open' : ''}">
                                <div class="inner-content pt-3 mt-3 border-t border-purple-500/10">
                                    <div class="bg-gradient-to-r from-purple-900/30 to-pink-900/30 p-3.5 rounded-xl border border-pink-500/20 flex items-start gap-2.5">
                                        <i class="fa-solid fa-lightbulb text-amber-400 text-lg mt-0.5"></i>
                                        <div>
                                            <span class="text-xs font-bold text-amber-300 block mb-0.5">ব্যাখ্যা ও ব্যবহারের নিয়ম:</span>
                                            <p class="text-sm md:text-base text-purple-100 leading-relaxed">
                                                ${item.exp}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Handle Card Step-by-Step Toggle
        function handleCardClick(id) {
            if (cardStates[id] < 3) {
                cardStates[id] += 1;
            } else {
                cardStates[id] = 1; // Cycle back to Step 1
            }
            renderCards(document.getElementById('searchInput').value);
        }

        // Event Listeners for Accent Switching
        document.getElementById('accentUS').addEventListener('click', () => {
            selectedAccent = 'en-US';
            document.getElementById('accentUS').className = 'px-3 py-1.5 rounded-lg bg-purple-600 text-white font-bold transition-all shadow-md';
            document.getElementById('accentUK').className = 'px-3 py-1.5 rounded-lg text-purple-300 hover:text-white transition-all';
        });

        document.getElementById('accentUK').addEventListener('click', () => {
            selectedAccent = 'en-GB';
            document.getElementById('accentUK').className = 'px-3 py-1.5 rounded-lg bg-purple-600 text-white font-bold transition-all shadow-md';
            document.getElementById('accentUS').className = 'px-3 py-1.5 rounded-lg text-purple-300 hover:text-white transition-all';
        });

        // Search Filter Event
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderCards(e.target.value);
        });

        // Global Controls
        document.getElementById('expandAllBtn').addEventListener('click', () => {
            itemsData.forEach(item => cardStates[item.id] = 3);
            renderCards(document.getElementById('searchInput').value);
        });

        document.getElementById('resetAllBtn').addEventListener('click', () => {
            itemsData.forEach(item => cardStates[item.id] = 1);
            renderCards(document.getElementById('searchInput').value);
        });

        // Initial Render
        window.onload = () => {
            renderCards();
        };
    </script>
</body>
</html>
