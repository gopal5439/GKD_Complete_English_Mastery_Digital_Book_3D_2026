            margin-top: 0.5rem;

            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary);

            font-family: var(--font-en);
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 600;

            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
            padding: 0.9rem;
            font-family: var(--font-bn);

            padding-top: 0.5rem;

            gap: 0.4rem;

            color: var(--text-muted);

            from { opacity: 0; transform: translateY(6px); }

            body { padding: 1rem 0.5rem; }
            header h1 { font-size: 1.6rem; }
            header h2 { font-size: 1.2rem; }
            .cards-container { grid-template-columns: 1fr; }

                bn: "২৪. বিশ্বাস কর, আমি এর চেয়ে ভালো কিছু আশা করেছিলাম।",
                en: "Believe me, I expected something better.",
                pron: "উচ্চারণ: বিলিভ মি, আই এক্সপেক্টিড সামথিং বেটার।",
                exp: "ব্যাখ্যা: প্রত্যাশার তুলনায় ফলাফল খারাপ হলে হতাশা প্রকাশ করতে বলা হয়।"
            },
            {
                bn: "২৫. যাই হোক, শেষ পর্যন্ত সব ঠিক হয়ে গেছে!",
                en: "Anyway, everything worked out in the end.",
                pron: "উচ্চারণ: এনিওয়ে, এভরিথিং ওয়ার্কড আউট ইন দ্য এন্ড।",
                exp: "ব্যাখ্যা: Work out অর্থ কোনো সমস্যার সমাধান হওয়া বা ভালোভাবে সম্পন্ন হওয়া। In the end অর্থ শেষ পর্যন্ত।"
            }
        ];

        const container = document.getElementById('cardsContainer');

        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.step = '0'; // 0: BN only, 1: BN+EN, 2: BN+EN+EXP

            card.innerHTML = `
                <span class="card-number">#${String(index + 1).padStart(2, '0')}</span>
                <div class="sec-bn">${item.bn}</div>
                
                <div class="sec-en">
                    <div class="en-text">${item.en}</div>
                    <div class="en-pron">${item.pron}</div>
                </div>

                <div class="sec-exp">${item.exp}</div>

                <div class="audio-controls" onclick="event.stopPropagation()">
                    <button class="btn-3d btn-uk" onclick="speakText('${escapeQuotes(item.en)}', 'en-GB')">
                        🇬🇧 UK Voice
                    </button>
                    <button class="btn-3d btn-us" onclick="speakText('${escapeQuotes(item.en)}', 'en-US')">
                        🇺🇸 US Voice
                    </button>
                </div>
                <div class="click-hint">ক্লিক করুন (ধাপ ১/৩)</div>
            `;

            // Card Click Event for 3-step reveal
            card.addEventListener('click', () => {
                let currentStep = parseInt(card.dataset.step);
                const secEn = card.querySelector('.sec-en');
                const secExp = card.querySelector('.sec-exp');
                const hint = card.querySelector('.click-hint');

                if (currentStep === 0) {
                    secEn.style.display = 'block';
                    card.dataset.step = '1';
                    hint.textContent = 'পুনরায় ক্লিক করুন (ধাপ ২/৩)';
                } else if (currentStep === 1) {
                    secExp.style.display = 'block';
                    card.dataset.step = '2';
                    hint.textContent = 'লুকাবারে ক্লিক করুন (ধাপ ৩/৩)';
                } else {
                    secEn.style.display = 'none';
                    secExp.style.display = 'none';
                    card.dataset.step = '0';
                    hint.textContent = 'ক্লিক করুন (ধাপ ১/৩)';
                }
            });

            container.appendChild(card);
        });

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        // Web Speech API Text-To-Speech Function
        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop currently playing audio
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
